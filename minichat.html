<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>vJoseph — Atendimento Online</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .phone-container {
            width: 100%;
            max-width: 400px;
            background: #E5DDD5;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            position: relative;
            height: 800px;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 480px) {
            body { padding: 0; align-items: flex-start; }
            .phone-container { max-width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 3px;
            background: #25D366;
            transition: width 0.35s ease;
            z-index: 20;
        }

        .chat-header {
            background: #075E54;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            z-index: 10;
            flex-shrink: 0;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: #128C7E;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 17px;
            color: white;
            flex-shrink: 0;
            overflow: hidden;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .header-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
        .header-info p { font-size: 13px; opacity: 0.9; color: #d1fae5; }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #E5DDD5;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23ffffff' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        .message {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 18px;
            font-size: 14.5px;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeInUp 0.3s ease-out;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.received { background: white; align-self: flex-start; border-bottom-left-radius: 4px; color: #262626; }
        .message.sent { background: #DCF8C6; align-self: flex-end; border-bottom-right-radius: 4px; color: #262626; }

        .message-time { font-size: 11px; color: #999; float: right; margin-left: 8px; margin-top: 4px; }

        .typing {
            display: flex;
            gap: 4px;
            padding: 15px 20px;
            background: white;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            width: fit-content;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .typing-dot { width: 8px; height: 8px; background: #999; border-radius: 50%; animation: typingBounce 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 6px;
            animation: fadeInUp 0.4s ease-out;
        }

        .option-btn {
            background: white;
            border: 2px solid #128C7E;
            color: #128C7E;
            padding: 12px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            text-align: left;
            font-family: inherit;
        }

        .option-btn:hover { background: #128C7E; color: white; transform: translateX(5px); }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.selected { background: #128C7E; color: white; border-color: #128C7E; }

        .chat-input {
            background: #F0F0F0;
            padding: 12px 15px calc(12px + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #E0E0E0;
            flex-shrink: 0;
        }

        .input-box {
            flex: 1;
            background: white;
            border-radius: 25px;
            padding: 12px 18px;
            border: none;
            outline: none;
            font-size: 16px;
            color: #333;
            font-family: inherit;
        }

        .input-box::placeholder { color: #999; }

        .send-btn {
            width: 45px;
            height: 45px;
            background: #128C7E;
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 20px;
            flex-shrink: 0;
        }

        .send-btn:hover { transform: scale(1.1); background: #075E54; }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }

        /* Dark result overlay */
        .result-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f0f0f;
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 45px 22px 28px;
            box-sizing: border-box;
            color: white;
            animation: fadeIn 0.5s ease-out;
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result-overlay .check-icon {
            flex-shrink: 0;
            min-width: 90px;
            min-height: 90px;
            width: 90px;
            height: 90px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            box-shadow: 0 0 30px rgba(37, 211, 102, 0.3);
        }

        .result-overlay .check-icon svg {
            width: 45px;
            height: 45px;
            fill: none;
            stroke: white;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .result-overlay h2 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 10px 0;
            text-align: center;
            letter-spacing: -0.4px;
        }

        .result-overlay > p {
            font-size: 14px;
            color: #b0b0b0;
            text-align: center;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .profile-card {
            background: #1e1e1e;
            border-radius: 20px;
            width: 100%;
            padding: 22px;
            box-sizing: border-box;
            margin-bottom: 22px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .profile-card-title {
            font-size: 11px;
            color: #888;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
            font-size: 13px;
            align-items: flex-start;
            gap: 12px;
        }

        .profile-row:last-child { border-bottom: none; padding-bottom: 0; }

        .profile-label { color: #888; flex: 0.9; }
        .profile-value { color: white; font-weight: 600; flex: 1.1; text-align: right; }

        .whatsapp-btn-full {
            background: #25D366;
            color: white;
            width: 100%;
            padding: 17px;
            border-radius: 14px;
            text-align: center;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.25);
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .whatsapp-btn-full:hover { transform: translateY(-2px); background: #20ba56; }
        .whatsapp-btn-full:active { transform: scale(0.98); }

        .email-btn-full {
            background: transparent;
            color: #25D366;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
            display: none;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border: 1.5px solid #25D366;
            margin-top: 10px;
            font-family: inherit;
        }

        .redirect-status { margin-top: 14px; font-size: 12px; color: #888; text-align: center; }

        @media (max-width: 480px) {
            .phone-container { height: 100svh; max-width: 100%; border-radius: 0; }
            body { padding: 0; background: #E5DDD5; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>

    <div class="chat-header">
        <div class="avatar" id="avatar">
            <img id="avatarImg" alt="" style="display:none;width:100%;height:100%;object-fit:cover">
            <span id="avatarLetter">v</span>
        </div>
        <div class="header-info">
            <h3 id="brandName">vJoseph</h3>
            <p>Atendimento Online</p>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input" id="chatInput">
        <input type="text" class="input-box" id="textInput" placeholder="Digite sua resposta..." disabled>
        <button class="send-btn" id="sendBtn" disabled>➤</button>
    </div>

    <!-- Dark overlay de conclusão -->
    <div class="result-overlay" id="resultOverlay">
        <div class="check-icon">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>

        <h2>Análise Completa</h2>
        <p>Seu diagnóstico está pronto. Você está a um passo de falar com a gente.</p>

        <div class="profile-card" id="profileCard">
            <div class="profile-card-title">SEU PERFIL</div>
            <!-- preenchido via JS -->
        </div>

        <button class="whatsapp-btn-full" id="whatsappBtn" onclick="sendToWhatsApp()">
            📱 Enviar para o WhatsApp
        </button>

        <button class="email-btn-full" id="emailBtn" onclick="sendToEmail()">
            ✉️ Enviar por E-mail
        </button>

        <div class="redirect-status" id="redirectStatus"></div>
    </div>
</div>

<script>
    // Valores padrão — usados quando não há ?uid= ou a config remota falha
    let WHATSAPP_NUMBER = "5524999829182";
    let BRAND_NAME = "vJoseph";
    let GREETING_NAME = "Nexy";
    let AVATAR_URL = "";
    let REDIRECT_LINK = "";
    let EMAIL_DESTINO = "";
    let DESTINATION_TYPE = "whatsapp";
    let CLOSING_MESSAGE = "Podemos conversar?";
    const JOSEPHPAY_API = "https://josephpay-production.up.railway.app";

    function getVisitorId() {
        try {
            let v = sessionStorage.getItem("mc_visitor_id");
            if (!v) {
                v = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
                sessionStorage.setItem("mc_visitor_id", v);
            }
            return v;
        } catch(e) { return `${Date.now()}-${Math.random().toString(36).slice(2)}`; }
    }

    function trackProgress({ index, question, answer, questionsTotal, completed, finishedVia }) {
        const uid = new URLSearchParams(location.search).get("uid");
        if (!uid) return;
        fetch(`${JOSEPHPAY_API}/api/minichat/track-progress`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                owner_id: uid, visitor_id: getVisitorId(),
                index, question, answer,
                questions_total: questionsTotal,
                completed: !!completed, finished_via: finishedVia,
            }),
        }).catch(() => {});
    }

    function applyAvatar() {
        const img = document.getElementById("avatarImg");
        const letter = document.getElementById("avatarLetter");
        if (AVATAR_URL && img) {
            img.src = AVATAR_URL;
            img.style.display = "block";
            if (letter) letter.style.display = "none";
        }
    }

    // ESTADO
    let currentStep = 0;
    let userData = {};
    let usingDefaultFlow = true;

    const QUANDO_OPTIONS = ["Quanto antes", "Este mês", "Próximos meses", "Só estou pesquisando"];
    const PRODUTO_FALLBACK_OPTIONS = ["Procedimento estético", "Consulta inicial", "Tratamento facial", "Outro"];
    const OBJETIVO_FALLBACK_OPTIONS = ["Melhorar minha aparência", "Tratar um problema específico", "Conhecer as opções", "Tirar dúvidas"];

    function buildDefaultQuestions(products, objetivoOptions) {
        const steps = [];
        steps.push({
            id: 'produto',
            text: "Olá! 👋 Vamos fazer um diagnóstico rápido para te atender melhor.",
            subtext: "Qual procedimento ou serviço desperta seu interesse?",
            label: "Procedimento de interesse",
            type: 'options',
            options: (products && products.length) ? products : PRODUTO_FALLBACK_OPTIONS,
        });
        steps.push({
            id: 'objetivo',
            text: "Perfeito.",
            subtext: "Qual seu objetivo?",
            label: "Objetivo",
            type: 'options',
            options: (objetivoOptions && objetivoOptions.length) ? objetivoOptions : OBJETIVO_FALLBACK_OPTIONS,
        });
        steps.push({
            id: 'quando',
            text: "Entendido.",
            subtext: "Quando pretende realizar?",
            label: "Momento para iniciar",
            type: 'options',
            options: QUANDO_OPTIONS,
        });
        return steps;
    }

    const CONTACT_QUESTIONS = [
        { id: 'nome',       text: "Show, já estamos quase terminando.", subtext: "Qual seu nome completo?",            label: "Nome",              type: 'text', placeholder: 'Digite seu nome…' },
        { id: 'telefone',   text: "Perfeito.",                          subtext: "Qual seu telefone com WhatsApp?",    label: "WhatsApp",          type: 'text', placeholder: '(21) 99999-9999' },
        { id: 'nascimento', text: "Última pergunta.",                    subtext: "Qual sua data de nascimento?",       label: "Data de nascimento", type: 'text', placeholder: 'DD/MM/AAAA' },
    ];

    function withContactQuestions(steps) {
        const semDuplicata = (steps || []).filter(q => !['nome', 'telefone', 'nascimento'].includes(q.id));
        return [...semDuplicata, ...CONTACT_QUESTIONS];
    }

    let questions = withContactQuestions(buildDefaultQuestions([], null));

    async function loadMinichatConfig() {
        const uid = new URLSearchParams(location.search).get("uid");
        if (!uid) return;
        try {
            const res = await fetch(`${JOSEPHPAY_API}/api/minichat/config?uid=${encodeURIComponent(uid)}`);
            const data = await res.json();
            const cfg = data?.config;
            if (cfg || data?.producer_name) {
                if (cfg?.whatsapp_number) WHATSAPP_NUMBER = cfg.whatsapp_number;
                const resolvedName = cfg?.brand_name || data?.producer_name;
                if (resolvedName) BRAND_NAME = resolvedName;
                GREETING_NAME = cfg?.greeting_name || resolvedName || GREETING_NAME;
                if (cfg?.avatar_url) AVATAR_URL = cfg.avatar_url;
                if (cfg?.redirect_link) REDIRECT_LINK = cfg.redirect_link;
                if (cfg?.email_destino) EMAIL_DESTINO = cfg.email_destino;
                if (cfg?.closing_message) CLOSING_MESSAGE = cfg.closing_message;
                if (cfg?.destination_type) DESTINATION_TYPE = cfg.destination_type;
                {
                    const _wBtn = document.getElementById("whatsappBtn");
                    const _eBtn = document.getElementById("emailBtn");
                    if (DESTINATION_TYPE === "email") {
                        if (_wBtn) _wBtn.style.display = "none";
                        if (_eBtn) _eBtn.style.display = "flex";
                    } else if (EMAIL_DESTINO && !REDIRECT_LINK) {
                        if (_eBtn) _eBtn.style.display = "flex";
                    }
                }
                if (cfg && Array.isArray(cfg.questions) && cfg.questions.length) {
                    const custom = cfg.questions
                        .map((q, i) => ({
                            id: `q${i}`,
                            text: q.text || "",
                            subtext: q.subtext || "",
                            label: q.subtext || q.text || `Pergunta ${i+1}`,
                            type: 'options',
                            options: (q.options || []).filter(Boolean),
                        }))
                        .filter(q => (q.text || q.subtext) && q.options.length >= 2);
                    if (custom.length) {
                        questions = custom;
                        usingDefaultFlow = false;
                    }
                }
                const letter = document.getElementById("avatarLetter");
                const name = document.getElementById("brandName");
                if (letter) letter.textContent = BRAND_NAME[0] || "v";
                if (name) name.textContent = BRAND_NAME;
                applyAvatar();
                document.title = `${BRAND_NAME} — Atendimento Online`;
            }
            if (usingDefaultFlow) {
                let products = [];
                try {
                    const rp = await fetch(`${JOSEPHPAY_API}/api/minichat/products?uid=${encodeURIComponent(uid)}`);
                    const dp = await rp.json();
                    products = Array.isArray(dp?.products) ? dp.products : [];
                } catch(e) {}
                questions = buildDefaultQuestions(products, cfg?.objetivo_options);
            }
        } catch(e) {
            console.warn("[minichat] config remota indisponível, usando padrão", e.message);
        }
        questions = withContactQuestions(questions);
    }

    function reportMinichatOpen() {
        const uid = new URLSearchParams(location.search).get("uid");
        if (!uid) return;
        fetch(`${JOSEPHPAY_API}/api/track/visit`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: uid, domain: "minichat", page: "/minichat", source: "minichat", device: /Mobi|Android/i.test(navigator.userAgent) ? "mobile" : "desktop" }),
        }).catch(() => {});
    }

    function sendLeadToCRM() {
        const uid = new URLSearchParams(location.search).get("uid");
        if (!uid) return;
        const nomeLead = userData.nome || userData[questions[0]?.id] || "diagnóstico";
        fetch(`${JOSEPHPAY_API}/api/leads/create`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Owner-Key": uid },
            body: JSON.stringify({
                name: userData.nome ? userData.nome : `Lead Mini Chat (${nomeLead})`,
                phone: userData.telefone || null,
                birthday: userData.nascimento || null,
            }),
        }).catch(() => {});
    }

    // DOM refs
    const chatMessages = document.getElementById('chatMessages');
    const progressBar  = document.getElementById('progressBar');
    const resultOverlay = document.getElementById('resultOverlay');
    const profileCard   = document.getElementById('profileCard');
    const whatsappBtn   = document.getElementById('whatsappBtn');
    const emailBtn      = document.getElementById('emailBtn');
    const redirectStatus = document.getElementById('redirectStatus');
    const textInput     = document.getElementById('textInput');
    const sendBtn       = document.getElementById('sendBtn');

    function updateProgress() {
        const pct = questions.length ? (currentStep / questions.length) * 100 : 0;
        progressBar.style.width = pct + '%';
    }

    function getTime() {
        return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(text, isUser = false, subtext = null) {
        const div = document.createElement('div');
        div.className = `message ${isUser ? 'sent' : 'received'}`;
        let html = text.replace(/\n/g, '<br>');
        if (subtext) html += `<br><br><strong>${subtext}</strong>`;
        html += `<span class="message-time">${getTime()}</span>`;
        div.innerHTML = html;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'typing';
        div.id = 'typingEl';
        div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typingEl');
        if (el) el.remove();
    }

    function showOptions(question) {
        const div = document.createElement('div');
        div.className = 'options-container';
        div.id = 'optionsContainer';
        question.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.style.animationDelay = `${i * 0.07}s`;
            btn.onclick = () => selectAnswer(opt, question.id);
            div.appendChild(btn);
        });
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showFreeTextInput(question) {
        textInput.disabled = false;
        textInput.placeholder = question.placeholder || 'Digite sua resposta...';
        textInput.value = '';
        textInput.focus();
        sendBtn.disabled = false;

        const submit = () => {
            const val = textInput.value.trim();
            if (!val) return;
            textInput.removeEventListener('keydown', onKey);
            selectAnswer(val, question.id);
        };
        const onKey = (e) => { if (e.key === 'Enter') submit(); };
        textInput.addEventListener('keydown', onKey);
        sendBtn.onclick = submit;
    }

    function disableFreeTextInput() {
        textInput.disabled = true;
        textInput.value = '';
        textInput.placeholder = 'Digite sua resposta...';
        sendBtn.disabled = true;
        sendBtn.onclick = null;
    }

    function selectAnswer(value, id) {
        const opts = document.getElementById('optionsContainer');
        if (opts) opts.remove();
        disableFreeTextInput();

        addMessage(value, true);
        userData[id] = value;

        trackProgress({
            index: currentStep,
            question: questions[currentStep]?.subtext || questions[currentStep]?.text || "",
            answer: value,
            questionsTotal: questions.length,
        });

        currentStep++;
        updateProgress();

        if (currentStep < questions.length) {
            setTimeout(() => showQuestion(), 350);
        } else {
            setTimeout(() => finishDiagnostic(), 500);
        }
    }

    function showQuestion() {
        const q = questions[currentStep];
        showTyping();
        setTimeout(() => {
            hideTyping();
            addMessage(q.text, false, q.subtext);
            if (q.type === 'text') {
                showFreeTextInput(q);
            } else {
                showOptions(q);
            }
        }, 1200);
    }

    function finishDiagnostic() {
        progressBar.style.width = '100%';
        showTyping();
        setTimeout(() => {
            hideTyping();
            addMessage("Análise completa. ✓", false, "Preparando seu diagnóstico...");
            setTimeout(() => showResultOverlay(), 1200);
        }, 1200);
    }

    function showResultOverlay() {
        // Monta linhas do perfil dinamicamente
        const rows = questions.map(q => {
            const label = q.label || q.subtext || q.text || "";
            const value = userData[q.id] || "";
            return `<div class="profile-row">
                <span class="profile-label">${label}</span>
                <span class="profile-value">${value}</span>
            </div>`;
        }).join('');
        profileCard.innerHTML = `<div class="profile-card-title">SEU PERFIL</div>${rows}`;
        resultOverlay.style.display = 'flex';
    }

    function buildMessage() {
        if (usingDefaultFlow) {
            return `Olá, tudo bem? Segue meu diagnóstico para avaliação:\n\nNome: ${userData.nome||''}\nTelefone: ${userData.telefone||''}\nData de nascimento: ${userData.nascimento||''}\nProcedimento de interesse: ${userData.produto||''}\nObjetivo: ${userData.objetivo||''}\nMomento para iniciar: ${userData.quando||''}\n\nAguardo orientações 🤍`;
        }
        const linhas = questions.map(q => `• ${q.subtext || q.text}: ${userData[q.id] || ''}`).join('\n');
        return `Olá ${GREETING_NAME},\n\nAcabei de fazer o pré diagnóstico digital.\n\n*Meu perfil:*\n${linhas}\n\n${CLOSING_MESSAGE}`;
    }

    function sendToWhatsApp() {
        whatsappBtn.textContent = 'Enviando...';
        whatsappBtn.style.opacity = '0.8';
        whatsappBtn.style.pointerEvents = 'none';

        sendLeadToCRM();
        trackProgress({ index: questions.length - 1, questionsTotal: questions.length, completed: true, finishedVia: 'whatsapp' });

        const useRedirect = REDIRECT_LINK && DESTINATION_TYPE !== "whatsapp";
        const targetUrl = useRedirect ? REDIRECT_LINK : `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(buildMessage())}`;
        const btnFinalHtml = useRedirect ? '↗ Continuar' : '📱 Abrir WhatsApp';

        setTimeout(() => {
            whatsappBtn.innerHTML = '✓ Pronto!';
            whatsappBtn.style.background = '#1DA851';
            whatsappBtn.style.opacity = '1';
            redirectStatus.textContent = useRedirect ? 'Abrindo...' : 'Abrindo WhatsApp...';

            setTimeout(() => {
                window.open(targetUrl, '_blank');
                setTimeout(() => {
                    redirectStatus.textContent = 'Se não abrir, clique no botão novamente.';
                    whatsappBtn.innerHTML = btnFinalHtml;
                    whatsappBtn.style.pointerEvents = 'auto';
                    whatsappBtn.onclick = () => window.open(targetUrl, '_blank');
                }, 1000);
            }, 700);
        }, 600);
    }

    function sendToEmail() {
        emailBtn.textContent = 'Enviando...';
        emailBtn.style.pointerEvents = 'none';
        sendLeadToCRM();
        trackProgress({ index: questions.length - 1, questionsTotal: questions.length, completed: true, finishedVia: 'email' });
        const subject = `Pré-diagnóstico digital — ${GREETING_NAME}`;
        const mailtoUrl = `mailto:${EMAIL_DESTINO}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(buildMessage())}`;
        setTimeout(() => {
            emailBtn.innerHTML = '✓ Abrindo e-mail…';
            redirectStatus.textContent = 'Se não abrir, clique novamente.';
            redirectStatus.style.opacity = '1';
            window.location.href = mailtoUrl;
            setTimeout(() => {
                emailBtn.innerHTML = '✉️ Enviar por E-mail';
                emailBtn.style.pointerEvents = 'auto';
                emailBtn.onclick = () => { window.location.href = mailtoUrl; };
            }, 1500);
        }, 500);
    }

    window.onload = () => {
        reportMinichatOpen();
        loadMinichatConfig().finally(() => {
            setTimeout(() => showQuestion(), 400);
        });
    };
</script>

</body>
</html>
