<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>vJoseph — Atendimento Online</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .phone-container {
            width: 100%;
            max-width: 400px;
            background: #E5DDD5;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            position: relative;
            height: 800px;
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 480px) {
            body { padding: 0; align-items: flex-start; }
            .phone-container { max-width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 3px;
            background: #25D366;
            transition: width 0.35s ease;
            z-index: 20;
        }

        .chat-header {
            background: #075E54;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            z-index: 10;
            flex-shrink: 0;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: #128C7E;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 17px;
            color: white;
            flex-shrink: 0;
            overflow: hidden;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .header-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
        .header-info p { font-size: 13px; opacity: 0.9; color: #d1fae5; }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #E5DDD5;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23ffffff' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        .message {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 18px;
            font-size: 14.5px;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeInUp 0.3s ease-out;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.received { background: white; align-self: flex-start; border-bottom-left-radius: 4px; color: #262626; }
        .message.sent { background: #DCF8C6; align-self: flex-end; border-bottom-right-radius: 4px; color: #262626; }

        .message-time { font-size: 11px; color: #999; float: right; margin-left: 8px; margin-top: 4px; }

        .typing {
            display: flex;
            gap: 4px;
            padding: 15px 20px;
            background: white;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            width: fit-content;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .typing-dot { width: 8px; height: 8px; background: #999; border-radius: 50%; animation: typingBounce 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 6px;
            animation: fadeInUp 0.4s ease-out;
        }

        .option-btn {
            background: white;
            border: 2px solid #128C7E;
            color: #128C7E;
            padding: 12px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            text-align: left;
            font-family: inherit;
        }

        .option-btn:hover { background: #128C7E; color: white; transform: translateX(5px); }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.selected { background: #128C7E; color: white; border-color: #128C7E; }

        .chat-input {
            background: #F0F0F0;
            padding: 12px 15px calc(12px + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid #E0E0E0;
            flex-shrink: 0;
        }

        .input-box {
            flex: 1;
            background: white;
            border-radius: 25px;
            padding: 12px 18px;
            border: none;
            outline: none;
            font-size: 16px;
            color: #333;
            font-family: inherit;
        }

        .input-box::placeholder { color: #999; }

        .send-btn {
            width: 45px;
            height: 45px;
            background: #128C7E;
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 20px;
            flex-shrink: 0;
        }

        .send-btn:hover { transform: scale(1.1); background: #075E54; }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }

        /* Dark result overlay */
        .result-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f0f0f;
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 45px 22px 28px;
            box-sizing: border-box;
            color: white;
            animation: fadeIn 0.5s ease-out;
            overflow-y: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .result-overlay .check-icon {
            flex-shrink: 0;
            min-width: 90px;
            min-height: 90px;
            width: 90px;
            height: 90px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            box-shadow: 0 0 30px rgba(37, 211, 102, 0.3);
        }

        .result-overlay .check-icon svg {
            width: 45px;
            height: 45px;
            fill: none;
            stroke: white;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .result-overlay h2 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 10px 0;
            text-align: center;
            letter-spacing: -0.4px;
        }

        .result-overlay > p {
            font-size: 14px;
            color: #b0b0b0;
            text-align: center;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .profile-card {
            background: #1e1e1e;
            border-radius: 20px;
            width: 100%;
            padding: 22px;
            box-sizing: border-box;
            margin-bottom: 22px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .profile-card-title {
            font-size: 11px;
            color: #888;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
            font-size: 13px;
            align-items: flex-start;
            gap: 12px;
        }

        .profile-row:last-child { border-bottom: none; padding-bottom: 0; }

        .profile-label { color: #888; flex: 0.9; }
        .profile-value { color: white; font-weight: 600; flex: 1.1; text-align: right; }

        .whatsapp-btn-full {
            background: #25D366;
            color: white;
            width: 100%;
            padding: 17px;
            border-radius: 14px;
            text-align: center;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.25);
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .whatsapp-btn-full:hover { transform: translateY(-2px); background: #20ba56; }
        .whatsapp-btn-full:active { transform: scale(0.98); }

        .email-btn-full {
            background: transparent;
            color: #25D366;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
            display: none;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border: 1.5px solid #25D366;
            margin-top: 10px;
            font-family: inherit;
        }

        .redirect-status { margin-top: 14px; font-size: 12px; color: #888; text-align: center; }

        @media (max-width: 480px) {
            .phone-container { height: 100svh; max-width: 100%; border-radius: 0; }
            body { padding: 0; background: #E5DDD5; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }

        /* ── Modelo visual "E-mail" (inspirado no mini chat da CAA Renovations) ──
           Só entra quando o Admin escolhe o modelo "E-mail" — o modelo WhatsApp de
           sempre continua exatamente igual. Cores vêm do produtor (--mc-bg/--mc-accent). */
        body.tpl-email { background: var(--mc-bg-deep); }
        body.tpl-email .phone-container { background: var(--mc-bg); border: 1px solid rgba(255,255,255,0.12); }
        body.tpl-email .progress-bar { background: var(--mc-accent); }
        body.tpl-email .chat-header { background: var(--mc-bg); border-bottom: 0.5px solid rgba(255,255,255,0.14); box-shadow: none; padding: 22px 22px 16px; }
        body.tpl-email .avatar { background: #ffffff; color: var(--mc-bg); border-radius: 10px; }
        body.tpl-email .header-info h3 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
        body.tpl-email .header-info p { color: rgba(255,255,255,0.6); }
        body.tpl-email .chat-messages { background: var(--mc-bg); background-image: none; gap: 16px; padding: 24px 20px; }
        body.tpl-email .message { border-radius: 20px; font-size: 15px; padding: 14px 18px; box-shadow: none; }
        body.tpl-email .message.received { background: rgba(255,255,255,0.09); color: #ffffff; border-bottom-left-radius: 6px; }
        body.tpl-email .message.sent { background: var(--mc-accent); color: #ffffff; border-bottom-right-radius: 6px; }
        body.tpl-email .message-time { display: none; }
        body.tpl-email .typing { background: rgba(255,255,255,0.09); box-shadow: none; }
        body.tpl-email .typing-dot { background: rgba(255,255,255,0.6); }
        body.tpl-email .option-btn { background: transparent; border: 1.5px solid rgba(255,255,255,0.18); color: #ffffff; border-radius: 14px; padding: 15px 18px; }
        body.tpl-email .option-btn:hover { background: rgba(255,255,255,0.08); border-color: var(--mc-accent); color: #ffffff; transform: translateX(4px); }
        body.tpl-email .option-btn.selected { background: var(--mc-accent); border-color: var(--mc-accent); }
        body.tpl-email .chat-input { background: var(--mc-bg); border-top: 0.5px solid rgba(255,255,255,0.14); }
        body.tpl-email .input-box { background: rgba(255,255,255,0.09); color: #ffffff; }
        body.tpl-email .input-box::placeholder { color: rgba(255,255,255,0.5); }
        body.tpl-email .send-btn { background: var(--mc-accent); }
        body.tpl-email .send-btn:hover { background: var(--mc-accent); filter: brightness(1.1); }
        body.tpl-email .send-btn:disabled { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.4); filter: none; }
        body.tpl-email .result-overlay { background: var(--mc-bg); }
        body.tpl-email .result-overlay > p { color: rgba(255,255,255,0.6); }
        body.tpl-email .profile-card { background: rgba(255,255,255,0.07); border: 0.5px solid rgba(255,255,255,0.14); box-shadow: none; }
        body.tpl-email .profile-card-title { color: rgba(255,255,255,0.55); }
        body.tpl-email .profile-row { border-bottom-color: rgba(255,255,255,0.12); }
        body.tpl-email .profile-label { color: rgba(255,255,255,0.6); }
        body.tpl-email .email-btn-full.primary { background: var(--mc-accent); color: #ffffff; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        body.tpl-email .redirect-status { color: rgba(255,255,255,0.6); }
        @media (max-width: 480px) {
            body.tpl-email { background: var(--mc-bg); }
            body.tpl-email .phone-container { border: none; }
        }
        /* Botão de e-mail como ação principal (modo "E-mail"), em qualquer modelo */
        .email-btn-full.primary { background: #25D366; color: white; border: none; padding: 17px; font-weight: 700; font-size: 16px; margin-top: 0; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
        .email-btn-full.done { pointer-events: none; }
    </style>
</head>

    <div class="chat-header">
        <div class="avatar" id="avatar">
            <img id="avatarImg" alt="" style="display:none;width:100%;height:100%;object-fit:cover">

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input" id="chatInput">

        <button class="send-btn" id="sendBtn" disabled>➤</button>

        <button class="email-btn-full" id="emailBtn" onclick="sendToEmail()">

        <div class="redirect-status" id="redirectStatus"></div>

</div>

            contactEmail: [

        },
    };
    const T = () => I18N[LANG] || I18N.pt;
    const JOSEPHPAY_API = "https://josephpay-production.up.railway.app";
    // Número salvo com formatação (espaço, traço, parênteses) ou sem o código do país
    // quebra o link do WhatsApp — o app não reconhece como telefone e mostra "nome de
    // usuário não está no WhatsApp" em vez de abrir a conversa. Normaliza aqui, na hora
    // de montar o link, pra funcionar mesmo pra número já salvo assim antes dessa correção.
    function normalizeWhatsappNumber(raw) {
        let digits = String(raw || '').replace(/\D/g, '');
        if (digits.length === 10 || digits.length === 11) digits = '55' + digits;
        return digits;
    }

    function getVisitorId() {
        try {
            let v = sessionStorage.getItem("mc_visitor_id");
            if (!v) {
                v = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
                sessionStorage.setItem("mc_visitor_id", v);
            }
            return v;
        } catch(e) { return `${Date.now()}-${Math.random().toString(36).slice(2)}`; }
    }

    // De onde a pessoa veio (só pra métrica do Admin — não muda nada no chat). Google Ads
    // quando o link traz gclid/gbraid/wbraid, utm de anúncio do Google, ou o jp_ads=1 que
    // o sensor.js do site do cliente acrescenta no link do Mini Chat. Guardado na sessão
    // pra continuar igual nas perguntas seguintes.
    function getOrigem() {
        try { const c = sessionStorage.getItem('mc_origem'); if (c) return c; } catch(e) {}
        let o = 'direto';
        try {
            const q = new URLSearchParams(location.search);
            const src = (q.get('utm_source') || q.get('jp_src') || '').toLowerCase();
            const med = (q.get('utm_medium') || '').toLowerCase();
            const ref = document.referrer || '';
            if (q.get('gclid') || q.get('gbraid') || q.get('wbraid') || q.get('jp_ads') === '1' || (/google/.test(src) && /cpc|ppc|paid|ads/.test(med))) o = 'google_ads';
            else if (src) o = /insta/.test(src) ? 'instagram' : /face|^fb/.test(src) ? 'facebook' : /whats|^wa$|wpp/.test(src) ? 'whatsapp' : /google/.test(src) ? 'google' : src === 'direto' ? 'direto' : src === 'referral' ? 'site' : 'outro';
            else if (ref) {
                const h = new URL(ref).hostname;
                o = /(^|\.)google\./.test(h) ? 'google' : /instagram/.test(h) ? 'instagram' : /facebook|(^|\.)fb\./.test(h) ? 'facebook' : /whatsapp/.test(h) ? 'whatsapp' : /josephpay/.test(h) ? 'direto' : 'site';
            }
        } catch(e) {}
        try { sessionStorage.setItem('mc_origem', o); } catch(e) {}
        return o;
    }

    function trackProgress({ index, question, answer, questionsTotal, completed, finishedVia }) {
        const uid = new URLSearchParams(location.search).get("uid");
        if (!uid) return;
        fetch(`${JOSEPHPAY_API}/api/minichat/track-progress`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                owner_id: uid, visitor_id: getVisitorId(),
                index, question, answer,
                questions_total: questionsTotal,
                completed: !!completed, finished_via: finishedVia,
                origem: getOrigem(),
            }),
        }).catch(() => {});
    }

    function applyAvatar() {
        const img = document.getElementById("avatarImg");
        const letter = document.getElementById("avatarLetter");
        if (AVATAR_URL && img) {
            img.src = AVATAR_URL;
            img.style.display = "block";
            if (letter) letter.style.display = "none";
        }
    }

    // ESTADO
    let currentStep = 0;
    let userData = {};
    let usingDefaultFlow = true;

    // Opções padrão (textos em I18N) — as de "Só aparece se o cliente não tiver nenhum
    // produto cadastrado E a busca de produtos reais falhar" são neutras de propósito (não
    // é só clínica estética) pra nunca soar errado pra outros tipos de negócio.
    function buildDefaultQuestions(products, objetivoOptions) {
        const d = T().defaultQ;
        const steps = [];
        steps.push({
            id: 'produto',
            text: d.produtoText,
            subtext: d.produtoSub,
            label: d.produtoLabel,
            type: 'options',
            options: (products && products.length) ? products : d.produtoFallback,
        });
        steps.push({
            id: 'objetivo',
            text: d.objetivoText,
            subtext: d.objetivoSub,
            label: d.objetivoLabel,
            type: 'options',
            options: (objetivoOptions && objetivoOptions.length) ? objetivoOptions : d.objetivoFallback,
        });
        steps.push({
            id: 'quando',
            text: d.quandoText,
            subtext: d.quandoSub,
            label: d.quandoLabel,
            type: 'options',
            options: d.quando,
        });
        return steps;
    }

    // Modo "E-mail": o lead é respondido por e-mail, então pede o E-MAIL da pessoa (e
    // telefone) em vez de "telefone com WhatsApp" + nascimento. WhatsApp e "Ambos"
    // continuam com as mesmas 3 perguntas de sempre.
    function contactQuestions() {
        return DESTINATION_TYPE === "email" ? T().contactEmail : T().contact;
    }

    function withContactQuestions(steps) {
        const semDuplicata = (steps || []).filter(q => !['nome', 'telefone', 'nascimento', 'email'].includes(q.id));
        return [...semDuplicata, ...contactQuestions()];
    }

    let questions = withContactQuestions(buildDefaultQuestions([], null));

    async function loadMinichatConfig() {
        const uid = new URLSearchParams(location.search).get("uid");
        if (!uid) return;
        try {
            const res = await fetch(`${JOSEPHPAY_API}/api/minichat/config?uid=${encodeURIComponent(uid)}`);
            const data = await res.json();
            const cfg = data?.config;
            if (cfg || data?.producer_name) {
                if (cfg?.whatsapp_number) WHATSAPP_NUMBER = cfg.whatsapp_number;
                const resolvedName = cfg?.brand_name || data?.producer_name;
                if (resolvedName) BRAND_NAME = resolvedName;
                GREETING_NAME = cfg?.greeting_name || resolvedName || GREETING_NAME;
                if (cfg?.avatar_url) AVATAR_URL = cfg.avatar_url;
                if (cfg?.redirect_link) REDIRECT_LINK = cfg.redirect_link;
                if (cfg?.thanks_enabled && /^https?:\/\//i.test(cfg?.thanks_link || "")) THANKS_LINK = cfg.thanks_link;
                if (cfg?.email_destino) EMAIL_DESTINO = cfg.email_destino;
                if (cfg?.closing_message) CLOSING_MESSAGE = cfg.closing_message;
                if (cfg?.destination_type) DESTINATION_TYPE = cfg.destination_type;
                if (cfg?.language === "en" || cfg?.language === "es") LANG = cfg.language;
                if (cfg?.template === "email") TEMPLATE = "email";
                applyLanguageAndTemplate(cfg);
                {
                    const _wBtn = document.getElementById("whatsappBtn");
                    const _eBtn = document.getElementById("emailBtn");
                    if (DESTINATION_TYPE === "email") {
                        if (_wBtn) _wBtn.style.display = "none";
                        if (_eBtn) { _eBtn.style.display = "flex"; _eBtn.classList.add("primary"); }
                    } else if (EMAIL_DESTINO && !REDIRECT_LINK) {
                        if (_eBtn) _eBtn.style.display = "flex";
                    }
                }
                if (cfg && Array.isArray(cfg.questions) && cfg.questions.length) {
                    const custom = cfg.questions
                        .map((q, i) => ({
                            id: `q${i}`,
                            text: q.text || "",
                            subtext: q.subtext || "",
                            label: q.subtext || q.text || T().questionN(i+1),
                            type: 'options',
                            options: (q.options || []).filter(Boolean),
                        }))
                        .filter(q => (q.text || q.subtext) && q.options.length >= 2);
                    if (custom.length) {
                        questions = custom;
                        usingDefaultFlow = false;
                    }
                }
                const letter = document.getElementById("avatarLetter");
                const name = document.getElementById("brandName");
                if (letter) letter.textContent = BRAND_NAME[0] || "v";
                if (name) name.textContent = BRAND_NAME;
                applyAvatar();
                document.title = `${BRAND_NAME} — ${T().titleSuffix}`;
            }
            if (usingDefaultFlow) {
                // Os produtos já vêm junto na resposta de /api/minichat/config (evita um segundo
                // fetch que podia falhar sozinho). Só refaz a busca em separado — com retry — se
                // por algum motivo não vieram ali (ex: resposta de uma versão antiga em cache).
                let products = Array.isArray(data?.products) ? data.products : [];
                for (let tentativa = 0; tentativa < 2 && !products.length; tentativa++) {
                    try {
                        const rp = await fetch(`${JOSEPHPAY_API}/api/minichat/products?uid=${encodeURIComponent(uid)}`);
                        const dp = await rp.json();
                        products = Array.isArray(dp?.products) ? dp.products : [];
                    } catch(e) {
                        if (tentativa === 0) await new Promise(r => setTimeout(r, 800));
                    }
                }
                questions = buildDefaultQuestions(products, cfg?.objetivo_options);
            }
        } catch(e) {
            console.warn("[minichat] config remota indisponível, usando padrão", e.message);
        }
        questions = withContactQuestions(questions);
    }

    function reportMinichatOpen() {
        const uid = new URLSearchParams(location.search).get("uid");
        if (!uid) return;
        fetch(`${JOSEPHPAY_API}/api/track/visit`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: uid, domain: "minichat", page: "/minichat", source: "minichat", device: /Mobi|Android/i.test(navigator.userAgent) ? "mobile" : "desktop" }),
        }).catch(() => {});
    }

    // Aplica idioma e modelo visual nos textos/estilos fixos do HTML. Com "pt" +
    // "whatsapp" (padrão) não muda nada do que a página já mostrava.
    function applyLanguageAndTemplate(cfg) {
        const t = T();
        document.documentElement.lang = t.htmlLang;
        const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
        set("headerSubtitle", TEMPLATE === "email" ? t.headerSubtitleEmail : t.headerSubtitle);
        set("resultTitle", t.resultTitle);
        set("resultSubtitle", DESTINATION_TYPE === "email" ? t.resultSubtitleEmail : t.resultSubtitle);
        set("whatsappBtn", t.whatsappBtn);
        set("emailBtn", t.emailBtn);
        const input = document.getElementById("textInput");
        if (input) input.placeholder = t.placeholder;
        if (LANG !== "pt" && CLOSING_MESSAGE === I18N.pt.defaultClosing) CLOSING_MESSAGE = t.defaultClosing;
        if (TEMPLATE === "email") {
            const isHex = c => /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c || "");
            const bg = isHex(cfg?.bg_color) ? cfg.bg_color : "#0f1a3a";
            const accent = isHex(cfg?.accent_color) ? cfg.accent_color : "#c91d2a";
            document.body.style.setProperty("--mc-bg", bg);
            document.body.style.setProperty("--mc-bg-deep", `color-mix(in srgb, ${bg} 60%, #000)`);
            document.body.style.setProperty("--mc-accent", accent);
            document.body.classList.add("tpl-email");
        }
    }

    // ── Data de nascimento e telefone: aceita do jeito que a pessoa digitar ──────────
    // "09/08/2000", "09082000", "9-8-00", "090800"... tudo vira 09/08/2000 na bolha da
    // conversa (e na mensagem final), e o CRM recebe a data já certa (AAAA-MM-DD). Antes,
    // dependendo do jeito, o aniversário podia não entrar e aparecer "não informado".
    function parseBirthInput(raw) {
        const s = String(raw || '').trim();
        let a, b, y;
        let m = s.match(/^(\d{1,2})\D+(\d{1,2})\D+(\d{4}|\d{2})$/);
        if (m) { [, a, b, y] = m; }
        else {
            const d = s.replace(/\D/g, '');
            if (d.length === 8) { a = d.slice(0, 2); b = d.slice(2, 4); y = d.slice(4); }
            else if (d.length === 6) { a = d.slice(0, 2); b = d.slice(2, 4); y = d.slice(4); }
            else return null;
        }
        const hoje = new Date();
        y = Number(y);
        if (y < 100) y = y <= hoje.getFullYear() % 100 ? 2000 + y : 1900 + y;
        const mdy = T().dateOrder === 'mdy';
        const dia = Number(mdy ? b : a), mes = Number(mdy ? a : b);
        const dt = new Date(y, mes - 1, dia);
        if (dt.getFullYear() !== y || dt.getMonth() !== mes - 1 || dt.getDate() !== dia) return null;
        if (dt > hoje || y < hoje.getFullYear() - 120) return null;
        const p2 = n => String(n).padStart(2, '0');
        return { display: mdy ? `${p2(mes)}/${p2(dia)}/${y}` : `${p2(dia)}/${p2(mes)}/${y}`, iso: `${y}-${p2(mes)}-${p2(dia)}` };
    }

    // Telefone: aceita com parênteses, traço, espaço, +55... Em português mostra
    // formatado "(24) 99982-9182" e completa o 9 de celular antigo sem ele.
    function parsePhoneInput(raw) {
        let d = String(raw || '').replace(/\D/g, '');
        if (LANG !== 'pt') return d.length >= 7 ? { display: String(raw).trim(), digits: d } : null;
        let ddi = '';
        if ((d.length === 12 || d.length === 13) && d.startsWith('55')) { ddi = '55'; d = d.slice(2); }
        if (d.length === 10 && /[6-9]/.test(d[2])) d = d.slice(0, 2) + '9' + d.slice(2);
        if (d.length !== 10 && d.length !== 11) return null;
        const display = d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
        return { display, digits: ddi + d };
    }

    // Se a pessoa errar 2 vezes, aceita como ela escreveu — melhor um dado torto do
    // que travar o Mini Chat e perder o contato.
    const tentativasInvalidas = {};
    function normalizeContactAnswer(question, val) {
        const id = question.id;
        if (id !== 'nascimento' && id !== 'telefone') return { ok: true, value: val };
        const r = id === 'nascimento' ? parseBirthInput(val) : parsePhoneInput(val);
        if (r) {
            if (id === 'nascimento') userData.nascimentoISO = r.iso; else userData.telefoneDigits = r.digits;
            return { ok: true, value: r.display };
        }
        tentativasInvalidas[id] = (tentativasInvalidas[id] || 0) + 1;
        if (tentativasInvalidas[id] >= 3) return { ok: true, value: val };
        return { ok: false, msg: id === 'nascimento' ? T().invalidDate : T().invalidPhone };
    }

    // Só uma vez por visita: no modo e-mail o contato já é salvo sozinho ao terminar o
    // diagnóstico; sem essa trava, clicar no botão depois contaria a pessoa duas vezes.
    let leadSavedToCRM = false;
    function sendLeadToCRM() {
        const uid = new URLSearchParams(location.search).get("uid");
        if (!uid) return;
        if (leadSavedToCRM) return;
        leadSavedToCRM = true;
        const nomeLead = userData.nome || userData[questions[0]?.id] || "diagnóstico";
        fetch(`${JOSEPHPAY_API}/api/leads/create`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Owner-Key": uid },
            body: JSON.stringify({
                name: userData.nome ? userData.nome : `Lead Mini Chat (${nomeLead})`,
                phone: userData.telefoneDigits || userData.telefone || null,
                email: userData.email || null,
                birthday: userData.nascimentoISO || userData.nascimento || null,
                visitor_id: getVisitorId(),
            }),
        }).catch(() => {});
    }

    // Envia o diagnóstico direto pro e-mail de destino do produtor, pelo servidor —
    // não depende do visitante ter (ou apertar "enviar" no) app de e-mail. Resolve
    // true se enviou; false se o servidor pediu pra cair no jeito antigo (mailto).
    let leadEmailPromise = null;
    function sendLeadEmail() {
        const uid = new URLSearchParams(location.search).get("uid");
        if (!uid || !EMAIL_DESTINO) return Promise.resolve(false);
        if (leadEmailPromise) return leadEmailPromise;
        const contato = ['nome', 'telefone', 'nascimento', 'email'];
        const answers = questions
            .filter(q => !contato.includes(q.id))
            .map(q => ({ question: q.label || q.subtext || q.text || "", answer: userData[q.id] || "" }));
        leadEmailPromise = fetch(`${JOSEPHPAY_API}/api/minichat/lead-email`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                owner_id: uid, visitor_id: getVisitorId(),
                lead: { name: userData.nome || "", email: userData.email || "", phone: userData.telefone || "" },
                answers,
            }),
        }).then(r => r.json().then(d => r.ok && d?.ok)).catch(() => false)
          .then(ok => { if (!ok) leadEmailPromise = null; return !!ok; });
        return leadEmailPromise;
    }

    // Envio automático deu certo: avisa a pessoa, mas o botão continua ativo — tocar nele
    // abre o app de e-mail DELA com a mensagem pronta (pedido do Thomas), sem duplicar o
    // envio automático (que só acontece uma vez).
    function markEmailSent() {
        emailBtn.innerHTML = T().emailBtn;
        emailBtn.classList.remove("done");
        emailBtn.style.pointerEvents = 'auto';
        // Em "Ambos" o botão do WhatsApp continua ali embaixo — a frase de "vamos entrar
        // em contato" só faz sentido quando o e-mail é o único caminho.
        if (DESTINATION_TYPE !== "ambos") {
            redirectStatus.textContent = T().emailSentStatus(BRAND_NAME);
            redirectStatus.style.opacity = '1';
        }
    }

    // DOM refs
    const chatMessages = document.getElementById('chatMessages');
    const progressBar  = document.getElementById('progressBar');
    const resultOverlay = document.getElementById('resultOverlay');
    const profileCard   = document.getElementById('profileCard');
    const whatsappBtn   = document.getElementById('whatsappBtn');
    const emailBtn      = document.getElementById('emailBtn');
    const redirectStatus = document.getElementById('redirectStatus');
    const textInput     = document.getElementById('textInput');
    const sendBtn       = document.getElementById('sendBtn');

    function updateProgress() {
        const pct = questions.length ? (currentStep / questions.length) * 100 : 0;
        progressBar.style.width = pct + '%';
    }

    function getTime() {
        return new Date().toLocaleTimeString(T().locale, { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(text, isUser = false, subtext = null) {
        const div = document.createElement('div');
        div.className = `message ${isUser ? 'sent' : 'received'}`;
        let html = text.replace(/\n/g, '<br>');
        if (subtext) html += `<br><br><strong>${subtext}</strong>`;
        html += `<span class="message-time">${getTime()}</span>`;
        div.innerHTML = html;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'typing';
        div.id = 'typingEl';
        div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typingEl');
        if (el) el.remove();
    }

    function showOptions(question) {
        const div = document.createElement('div');
        div.className = 'options-container';
        div.id = 'optionsContainer';
        question.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.style.animationDelay = `${i * 0.07}s`;
            btn.onclick = () => selectAnswer(opt, question.id);
            div.appendChild(btn);
        });
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showFreeTextInput(question) {
        textInput.disabled = false;
        textInput.placeholder = question.placeholder || T().placeholder;
        textInput.type = question.type === 'email' ? 'email' : 'text';
        textInput.value = '';
        textInput.focus();
        sendBtn.disabled = false;

        const submit = () => {
            const val = textInput.value.trim();
            if (!val) return;
            if (question.type === 'email' && !/^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(val)) {
                addMessage(T().invalidEmail);
                textInput.focus();
                return;
            }
            const norm = normalizeContactAnswer(question, val);
            if (!norm.ok) {
                addMessage(norm.msg);
                textInput.value = '';
                textInput.focus();
                return;
            }
            textInput.removeEventListener('keydown', onKey);
            selectAnswer(norm.value, question.id);
        };
        const onKey = (e) => { if (e.key === 'Enter') submit(); };
        textInput.addEventListener('keydown', onKey);
        sendBtn.onclick = submit;
    }

    function disableFreeTextInput() {
        textInput.disabled = true;
        textInput.value = '';
        textInput.placeholder = T().placeholder;
        textInput.type = 'text';
        sendBtn.disabled = true;
        sendBtn.onclick = null;
    }

    function selectAnswer(value, id) {
        const opts = document.getElementById('optionsContainer');
        if (opts) opts.remove();
        disableFreeTextInput();

        addMessage(value, true);
        userData[id] = value;

        trackProgress({
            index: currentStep,
            question: questions[currentStep]?.subtext || questions[currentStep]?.text || "",
            answer: value,
            questionsTotal: questions.length,
        });

        currentStep++;
        updateProgress();

        if (currentStep < questions.length) {
            setTimeout(() => showQuestion(), 350);
        } else {
            setTimeout(() => finishDiagnostic(), 500);
        }
    }

    function showQuestion() {
        const q = questions[currentStep];
        showTyping();
        setTimeout(() => {
            hideTyping();
            addMessage(q.text, false, q.subtext);
            if (q.type === 'text' || q.type === 'email') {
                showFreeTextInput(q);
            } else {
                showOptions(q);
            }
        }, 1200);
    }

    function finishDiagnostic() {
        progressBar.style.width = '100%';
        showTyping();
        setTimeout(() => {
            hideTyping();
            addMessage(T().analysisDone, false, T().preparing);
            setTimeout(() => showResultOverlay(), 1200);
        }, 1200);
    }

    function showResultOverlay() {
        // Monta linhas do perfil dinamicamente
        const rows = questions.map(q => {
            const label = q.label || q.subtext || q.text || "";
            const value = userData[q.id] || "";
            return `<div class="profile-row">
                <span class="profile-label">${label}</span>
                <span class="profile-value">${value}</span>
            </div>`;
        }).join('');
        profileCard.innerHTML = `<div class="profile-card-title">${T().profileTitle}</div>${rows}`;
        resultOverlay.style.display = 'flex';

        // Todo mundo que termina o diagnóstico vira interessado no CRM NA HORA, em qualquer
        // modo (WhatsApp, E-mail ou Ambos) — antes, no modo WhatsApp, só entrava se a pessoa
        // tocasse no botão verde; quem terminava e fechava sumia do painel. Uma vez só: o
        // botão do WhatsApp/e-mail depois não conta a pessoa de novo (leadSavedToCRM).
        // A mensagem que vai pro WhatsApp não muda em nada.
        sendLeadToCRM();

        // Destino "E-mail" ou "Ambos": manda o diagnóstico pro e-mail do produtor assim
        // que a pessoa termina — sem depender de ela clicar em nada.
        if ((DESTINATION_TYPE === "email" || DESTINATION_TYPE === "ambos") && EMAIL_DESTINO) {
            if (DESTINATION_TYPE === "email") {
                trackProgress({ index: questions.length - 1, questionsTotal: questions.length, completed: true, finishedVia: 'email' });
                emailBtn.textContent = T().sending;
                emailBtn.style.pointerEvents = 'none';
            }
            sendLeadEmail().then(ok => {
                if (ok) { markEmailSent(); return; }
                // Falhou no servidor: volta o botão pro jeito antigo (abre o e-mail do visitante).
                emailBtn.innerHTML = T().emailBtn;
                emailBtn.style.pointerEvents = 'auto';
            });
        }
    }

    // Mensagem final (WhatsApp e e-mail): curta, organizada, com negrito no WhatsApp.
    // Leva o nome e as respostas — NÃO repete telefone, e-mail nem aniversário (no
    // WhatsApp o número já chega junto; tudo isso continua salvo no CRM). No e-mail vai
    // também o telefone, pra empresa poder ligar. Ex:
    //   Olá, *Clínica X*! 👋
    //   Sou *Maria* e acabei de fazer o pré-diagnóstico no seu site.
    //
    //   *Meu perfil*
    //   - *Interesse principal:* Limpeza de pele
    //
    //   Podemos conversar?
    const CONTATO_IDS = ['nome', 'telefone', 'nascimento', 'email'];
    function buildMessage(formato) {
        const t = T();
        const email = formato === 'email';
        const b = s => email ? s : `*${s}*`;
        const nome = String(userData.nome || '').trim();
        const linhas = questions
            .filter(q => !CONTATO_IDS.includes(q.id) && userData[q.id])
            .map(q => {
                let rotulo = String((usingDefaultFlow ? (q.label || q.subtext) : (q.subtext || q.label)) || q.text || '').trim();
                if (!/[?:]$/.test(rotulo)) rotulo += ':';
                return `— ${b(rotulo)} ${userData[q.id]}`;
            }).join('\n');
        let msg = `${t.msgHello(b(GREETING_NAME))}\n\n${nome ? t.msgIntro(b(nome)) : t.msgIntroNoName}`;
        if (email && userData.telefone) msg += `\n${t.msgPhone}: ${userData.telefone}`;
        if (linhas) msg += `\n\n📋 ${b(t.msgProfile)}\n${linhas}`;
        if (CLOSING_MESSAGE) msg += `\n\n${CLOSING_MESSAGE}`;
        return msg;
    }

    function sendToWhatsApp() {
        whatsappBtn.textContent = T().sending;
        whatsappBtn.style.opacity = '0.8';
        whatsappBtn.style.pointerEvents = 'none';

        sendLeadToCRM();
        trackProgress({ index: questions.length - 1, questionsTotal: questions.length, completed: true, finishedVia: 'whatsapp' });

        const useRedirect = REDIRECT_LINK && DESTINATION_TYPE !== "whatsapp";
        const targetUrl = useRedirect ? REDIRECT_LINK : `https://wa.me/${normalizeWhatsappNumber(WHATSAPP_NUMBER)}?text=${encodeURIComponent(buildMessage())}`;
        const btnFinalHtml = useRedirect ? T().continueBtn : T().openWhatsappBtn;

        setTimeout(() => {
            whatsappBtn.innerHTML = T().ready;
            whatsappBtn.style.background = '#1DA851';
            whatsappBtn.style.opacity = '1';
            redirectStatus.textContent = useRedirect ? T().opening : T().openingWhatsapp;

            setTimeout(() => {
                armThanksRedirect();
                window.open(targetUrl, '_blank');
                setTimeout(() => {
                    redirectStatus.textContent = T().retryClick;
                    whatsappBtn.innerHTML = btnFinalHtml;
                    whatsappBtn.style.pointerEvents = 'auto';
                    whatsappBtn.onclick = () => window.open(targetUrl, '_blank');
                }, 1000);
            }, 700);
        }, 600);
    }

    // Botão de e-mail: abre o app de e-mail da PRÓPRIA pessoa com a mensagem pronta pra
    // ela enviar (pedido do Thomas). O envio automático pelo servidor continua rodando
    // em paralelo (uma vez só) — garante que a empresa recebe mesmo se a pessoa não
    // apertar "enviar" no app dela.
    function sendToEmail() {
        sendLeadToCRM();
        trackProgress({ index: questions.length - 1, questionsTotal: questions.length, completed: true, finishedVia: 'email' });
        sendLeadEmail();
        openMailto();
    }

    // Página de obrigado / grupo (só produtor que marcou "Sim" no Admin): depois que a
    // pessoa toca em enviar (e-mail ou WhatsApp), sai pro app e VOLTA pro Mini Chat, segue
    // sozinha pro link — com ?lang=en|es se o Mini Chat não for em português. Sem isso
    // ligado, nada muda. O envio em si (e-mail/WhatsApp) é exatamente o mesmo.
    let thanksArmed = false;
    function goToThanks() {
        if (!thanksArmed || !THANKS_LINK) return;
        thanksArmed = false;
        let url = THANKS_LINK;
        try { const u = new URL(THANKS_LINK); if (LANG !== 'pt' && !u.searchParams.has('lang')) u.searchParams.set('lang', LANG); url = u.toString(); } catch (e) {}
        window.location.href = url;
    }
    function armThanksRedirect() {
        if (!THANKS_LINK || thanksArmed) return;
        thanksArmed = true;
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(goToThanks, 600); });
        window.addEventListener('pageshow', () => setTimeout(goToThanks, 600));
        // Computador sem app de e-mail/WhatsApp (a página nem sai da tela): segue mesmo assim.
        // Só com a página NA TELA — nunca tira a pessoa do app de e-mail antes de ela enviar.
        setTimeout(() => { if (document.visibilityState === 'visible') goToThanks(); }, 6000);
    }

    function openMailto() {
        armThanksRedirect();
        const subject = T().emailSubject(String(userData.nome || '').trim() || GREETING_NAME);
        const mailtoUrl = `mailto:${EMAIL_DESTINO}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(buildMessage('email'))}`;
        setTimeout(() => {
            emailBtn.innerHTML = T().openingEmail;
            redirectStatus.textContent = T().retryEmail;
            redirectStatus.style.opacity = '1';
            window.location.href = mailtoUrl;
            setTimeout(() => {
                emailBtn.innerHTML = T().emailBtn;
                emailBtn.style.pointerEvents = 'auto';
                emailBtn.onclick = () => { window.location.href = mailtoUrl; };
            }, 1500);
        }, 500);
    }

    window.onload = () => {
        reportMinichatOpen();
        loadMinichatConfig().finally(() => {
            setTimeout(() => showQuestion(), 400);
        });
    };
</script>

</body>
</html>
