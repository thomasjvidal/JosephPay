<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>vJoseph — Diagnóstico Digital</title>
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #1c1c1e;
            --bg-tertiary: #2c2c2e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --accent: #0a84ff;
            --accent-hover: #409cff;
            --success: #30d158;
            --success-dark: #248a3d;
            --surface: #1c1c1e;
            --border: #38383a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app-container {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            background: var(--bg-primary);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 60px 24px 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 0.5px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .brand-mark {
            width: 32px;
            height: 32px;
            background: var(--text-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: var(--bg-primary);
            letter-spacing: -0.5px;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .header-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-left: 44px;
        }

        .chat-container {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 22px;
            font-size: 17px;
            line-height: 1.4;
            font-weight: 400;
            letter-spacing: -0.2px;
            animation: messageSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes messageSlide {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-received {
            background: var(--bg-secondary);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            color: var(--text-primary);
        }

        .message-sent {
            background: var(--accent);
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            color: white;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 22px;
            border-bottom-left-radius: 6px;
            align-self: flex-start;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingPulse 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingPulse {
            0%, 60%, 100% { transform: scale(1); opacity: 0.4; }
            30% { transform: scale(1.2); opacity: 1; }
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 8px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .option-btn {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-primary);
            padding: 18px 24px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .option-btn:active {
            transform: scale(0.98);
        }

        .option-btn.selected {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .input-area {
            padding: 20px 24px 40px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid var(--border);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 8px 8px 8px 20px;
            border: 0.5px solid var(--border);
            transition: border-color 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
        }

        .text-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 17px;
            padding: 8px 0;
            font-family: inherit;
        }

        .text-input::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 18px;
        }

        .send-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.1);
        }

        .send-btn:disabled {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
        }

        /* TELA DE CONCLUSÃO PREMIUM */
        .completion-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .completion-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .check-container {
            position: relative;
            margin-bottom: 40px;
        }

        .check-circle {
            width: 120px;
            height: 120px;
            background: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transform: scale(0);
            animation: checkScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            box-shadow: 0 0 0 0 rgba(48, 209, 88, 0.4);
            animation: checkScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                       pulseSuccess 2s infinite 0.6s;
        }

        @keyframes checkScale {
            to { transform: scale(1); }
        }

        @keyframes pulseSuccess {
            0% { box-shadow: 0 0 0 0 rgba(48, 209, 88, 0.4); }
            70% { box-shadow: 0 0 0 30px rgba(48, 209, 88, 0); }
            100% { box-shadow: 0 0 0 0 rgba(48, 209, 88, 0); }
        }

        .check-icon {
            font-size: 60px;
            color: white;
            font-weight: 300;
            opacity: 0;
            animation: checkDraw 0.4s 0.3s ease-out forwards;
        }

        @keyframes checkDraw {
            from {
                opacity: 0;
                transform: scale(0.5) rotate(-10deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .completion-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.5s 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .completion-subtitle {
            font-size: 17px;
            color: var(--text-secondary);
            line-height: 1.5;
            text-align: center;
            margin-bottom: 40px;
            max-width: 300px;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.5s 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .diagnostic-card {
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            max-width: 360px;
            margin-bottom: 32px;
            border: 0.5px solid var(--border);
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.5s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .diagnostic-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .diagnostic-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 0.5px solid var(--border);
        }

        .diagnostic-item:last-child {
            border-bottom: none;
        }

        .diagnostic-label {
            color: var(--text-secondary);
            font-size: 15px;
        }

        .diagnostic-value {
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 600;
            text-align: right;
            max-width: 60%;
        }

        .cta-button {
            width: 100%;
            max-width: 360px;
            background: var(--success);
            color: white;
            border: none;
            padding: 20px 32px;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.5s 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
            overflow: hidden;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(48, 209, 88, 0.3);
        }

        .cta-button:active {
            transform: scale(0.98);
        }

        .cta-button.sending {
            background: var(--success-dark);
            pointer-events: none;
        }

        .cta-button.sending::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .whatsapp-icon {
            font-size: 20px;
        }

        .redirect-status {
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-secondary);
            opacity: 0;
            animation: fadeIn 0.3s 0.8s forwards;
        }

        .hidden {
            display: none !important;
        }

        @media (min-width: 431px) {
            body {
                background: #111;
            }
            .app-container {
                border-left: 1px solid var(--border);
                border-right: 1px solid var(--border);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="header">
        <div class="brand">
            <div class="brand-mark" id="brandMark">v</div>
            <div class="brand-name" id="brandName">vJoseph</div>
        </div>
        <div class="header-subtitle">Diagnóstico Digital</div>
    </header>

    <main class="chat-container" id="chatContainer">
        <!-- Mensagens aparecem aqui -->
    </main>

    <div class="input-area" id="inputArea">
        <div class="input-wrapper">
            <input type="text" class="text-input" id="textInput" placeholder="Digite sua resposta..." disabled>
            <button class="send-btn" id="sendBtn" disabled>➤</button>
        </div>
    </div>

    <!-- TELA DE CONCLUSÃO -->
    <div class="completion-overlay" id="completionOverlay">
        <div class="check-container">
            <div class="check-circle">
                <span class="check-icon">✓</span>
            </div>
        </div>

        <h2 class="completion-title">Análise Completa</h2>
        <p class="completion-subtitle">Seu diagnóstico está pronto. Você está a um passo da sua presença digital profissional.</p>

        <div class="diagnostic-card" id="diagnosticCard">
            <div class="diagnostic-title">Resumo do Diagnóstico</div>
            <!-- Items preenchidos via JS -->
        </div>

        <button class="cta-button" id="whatsappBtn" onclick="sendToWhatsApp()">
            <span class="whatsapp-icon">📱</span>
            <span>Enviar para o WhatsApp</span>
        </button>

        <div class="redirect-status" id="redirectStatus"></div>
    </div>
</div>

<script>
    // CONFIGURAÇÃO
    // Valores padrão (fallback quando não há ?uid= na URL ou a config remota falha)
    let WHATSAPP_NUMBER = "5524999829182"; // Nexy
    let BRAND_NAME = "vJoseph";
    let GREETING_NAME = "Nexy";
    const JOSEPHPAY_API = "https://josephpay-production.up.railway.app";

    // Carrega configuração do produtor via ?uid= (multi-cliente).
    // Se ausente ou falhar, mantém os valores padrão acima — não quebra o widget.
    async function loadMinichatConfig() {
        const uid = new URLSearchParams(location.search).get("uid");
        if (!uid) return;
        try {
            const res = await fetch(`${JOSEPHPAY_API}/api/minichat/config?uid=${encodeURIComponent(uid)}`);
            const data = await res.json();
            const cfg = data?.config;
            if (!cfg) return;
            if (cfg.whatsapp_number) WHATSAPP_NUMBER = cfg.whatsapp_number;
            if (cfg.brand_name) BRAND_NAME = cfg.brand_name;
            GREETING_NAME = cfg.greeting_name || cfg.brand_name || GREETING_NAME;
            const mark = document.getElementById("brandMark");
            const name = document.getElementById("brandName");
            if (mark) mark.textContent = BRAND_NAME[0] || "v";
            if (name) name.textContent = BRAND_NAME;
            document.title = `${BRAND_NAME} — Diagnóstico Digital`;
        } catch (e) {
            console.warn("[minichat] config remota indisponível, usando padrão", e.message);
        }
    }

    // Envia o lead capturado para o CRM do produtor (fire-and-forget)
    function sendLeadToCRM() {
        const uid = new URLSearchParams(location.search).get("uid");
        if (!uid) return;
        fetch(`${JOSEPHPAY_API}/api/leads/create`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Owner-Key": uid },
            body: JSON.stringify({
                name: `Lead Mini Chat (${userData.objetivo || "diagnóstico"})`,
            }),
        }).catch(() => {});
    }

    // ESTADO
    let currentStep = 0;
    let userData = {
        objetivo: '',
        situacao: '',
        problema: '',
        prioridade: ''
    };

    // FLUXO OTIMIZADO - APENAS 4 PERGUNTAS
    const questions = [
        {
            id: 'objetivo',
            text: "Olá. Vamos fazer um diagnóstico rápido da sua presença digital.\n\nLeva menos de 1 minuto.",
            subtext: "Qual seu principal objetivo hoje?",
            options: [
                "Conseguir mais clientes",
                "Passar mais credibilidade",
                "Ter um link profissional",
                "Receber agendamentos"
            ]
        },
        {
            id: 'situacao',
            text: "Perfeito.",
            subtext: "Qual sua situação atual?",
            options: [
                "Não tenho site",
                "Só tenho Instagram",
                "Site antigo/desatualizado",
                "Site não converte"
            ]
        },
        {
            id: 'problema',
            text: "Entendido.",
            subtext: "Qual sua maior dificuldade hoje?",
            options: [
                "Perguntam preço e somem",
                "Explico tudo no WhatsApp",
                "Não pareço profissional",
                "Não tenho autoridade digital"
            ]
        },
        {
            id: 'prioridade',
            text: "Última pergunta.",
            subtext: "Se tivesse um site hoje, prioridade máxima seria?",
            options: [
                "Mostrar serviços claros",
                "Receber mais contatos",
                "Ter link profissional",
                "Sistema de agendamento"
            ]
        }
    ];

    const chatContainer = document.getElementById('chatContainer');
    const completionOverlay = document.getElementById('completionOverlay');
    const diagnosticCard = document.getElementById('diagnosticCard');
    const whatsappBtn = document.getElementById('whatsappBtn');
    const redirectStatus = document.getElementById('redirectStatus');

    function addMessage(text, isUser = false, subtext = null) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'message-sent' : 'message-received'}`;

        let content = text;
        if (subtext) {
            content += `<br><br><strong style="color: ${isUser ? 'white' : 'var(--text-primary)'}">${subtext}</strong>`;
        }

        messageDiv.innerHTML = content;
        chatContainer.appendChild(messageDiv);
        scrollToBottom();
    }

    function showTyping() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing-indicator';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = `
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        `;
        chatContainer.appendChild(typingDiv);
        scrollToBottom();
    }

    function hideTyping() {
        const typing = document.getElementById('typingIndicator');
        if (typing) typing.remove();
    }

    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showOptions(question) {
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options-container';
        optionsDiv.id = 'optionsContainer';

        question.options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = option;
            btn.style.animationDelay = `${index * 0.08}s`;
            btn.onclick = () => selectOption(option, question.id);
            optionsDiv.appendChild(btn);
        });

        chatContainer.appendChild(optionsDiv);
        scrollToBottom();
    }

    function selectOption(value, id) {
        // Remove opções
        const options = document.getElementById('optionsContainer');
        if (options) options.remove();

        // Adiciona resposta do usuário
        addMessage(value, true);

        // Salva dados
        userData[id] = value;

        // Próxima pergunta
        currentStep++;

        if (currentStep < questions.length) {
            setTimeout(() => showQuestion(), 300);
        } else {
            setTimeout(() => finishDiagnostic(), 500);
        }
    }

    function showQuestion() {
        const question = questions[currentStep];

        showTyping();

        setTimeout(() => {
            hideTyping();
            addMessage(question.text, false, question.subtext);
            showOptions(question);
        }, 1000);
    }

    function finishDiagnostic() {
        showTyping();

        setTimeout(() => {
            hideTyping();
            addMessage("Análise completa. ✓", false, "Preparando seu diagnóstico...");

            setTimeout(() => {
                showCompletionScreen();
            }, 1200);
        }, 1200);
    }

    function showCompletionScreen() {
        // Preenche card de diagnóstico
        diagnosticCard.innerHTML = `
            <div class="diagnostic-title">Seu Perfil</div>
            <div class="diagnostic-item">
                <span class="diagnostic-label">Objetivo</span>
                <span class="diagnostic-value">${userData.objetivo}</span>
            </div>
            <div class="diagnostic-item">
                <span class="diagnostic-label">Situação</span>
                <span class="diagnostic-value">${userData.situacao}</span>
            </div>
            <div class="diagnostic-item">
                <span class="diagnostic-label">Dor Principal</span>
                <span class="diagnostic-value">${userData.problema}</span>
            </div>
            <div class="diagnostic-item">
                <span class="diagnostic-label">Prioridade</span>
                <span class="diagnostic-value">${userData.prioridade}</span>
            </div>
        `;

        // Mostra overlay
        completionOverlay.classList.add('active');
    }

    function sendToWhatsApp() {
        // Estado de envio
        whatsappBtn.classList.add('sending');
        whatsappBtn.innerHTML = '<span style="opacity: 0">Enviando...</span>';

        // Monta mensagem completa para o produtor
        const message = `Olá ${GREETING_NAME},

Acabei de fazer o pré diagnóstico digital.

*Meu perfil:*
• Objetivo: ${userData.objetivo}
• Situação atual: ${userData.situacao}
• Maior dificuldade: ${userData.problema}
• Prioridade: ${userData.prioridade}

Podemos conversar?`;

        const encodedMessage = encodeURIComponent(message);
        const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;
        sendLeadToCRM();

        // Feedback visual
        setTimeout(() => {
            whatsappBtn.classList.remove('sending');
            whatsappBtn.innerHTML = '<span>✓</span><span>Mensagem pronta!</span>';
            whatsappBtn.style.background = 'var(--success-dark)';

            redirectStatus.textContent = 'Abrindo WhatsApp...';
            redirectStatus.style.opacity = '1';

            // Redireciona após breve delay para ver o check
            setTimeout(() => {
                window.open(whatsappUrl, '_blank');

                // Atualiza status
                setTimeout(() => {
                    redirectStatus.textContent = 'Se não abrir automaticamente, clique novamente no botão acima.';
                    whatsappBtn.innerHTML = '<span class="whatsapp-icon">📱</span><span>Abrir WhatsApp</span>';
                    whatsappBtn.onclick = () => window.open(whatsappUrl, '_blank');
                }, 1000);

            }, 800);

        }, 600);
    }

    // Inicialização
    window.onload = () => {
        loadMinichatConfig().finally(() => {
            setTimeout(() => {
                showQuestion();
            }, 400);
        });
    };
</script>

</body>
</html>
