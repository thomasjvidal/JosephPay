      {!overview&&<div style={{color:MUTED,fontSize:13,textAlign:"center",padding:20}}>Carregando…</div>}
      {overview&&(<>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {[
            {label:"Investimento",v:overview.investimento!=null?fmtBRL(overview.investimento):"—",c:GOLD},
            {label:"Contatos",v:String(a.contatos),c:GOLD},
            {label:"Clientes",v:String(a.clientes),c:GREEN},
            {label:"Faturamento",v:fmtBRL(a.faturamento),c:GOLD},
          ].map(r=>(
            <div key={r.label} style={{background:CARD,border:`1px solid ${BDR}`,borderRadius:16,padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{color:MUTED,fontSize:11,fontWeight:700,letterSpacing:"0.06em",textTransform:"uppercase"}}>{r.label}</span>
              <span style={{color:r.c,fontFamily:SF,fontWeight:700,fontSize:20}}>{r.v}</span>
            </div>
          ))}
        </div>
        <div className="kpi-grid">
          <KPICard label="Custo por contato" value={custoContato} icon="◈"/>
          <KPICard label="Custo por cliente" value={custoCliente} icon="◎"/>
          <KPICard label="Visitas no período" value={String(a.visitas)} icon="👁"/>
          <KPICard label="Visitas de anúncio" value={String(a.visitasAnuncio)} sub="clique pago" icon="⊕"/>
        </div>
        {!overview.adsConnected&&(
          <div style={{background:`${GOLD}10`,border:`1px solid ${GOLD}30`,borderRadius:14,padding:"12px 14px",color:MUTED,fontSize:12,lineHeight:1.5}}>
            Contatos, clientes e faturamento acima já são reais. Investimento e campanhas aparecem depois de conectar o Google Ads pra esse cliente.{" "}
            <button onClick={()=>onNav("integracao")} style={{background:"none",border:"none",color:GOLD,fontWeight:700,cursor:"pointer",fontFamily:F,padding:0,textDecoration:"underline"}}>Configurar agora</button>
          </div>
        )}
      </>)}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>

        ))}

function GARelatorioGerado({clienteId,cliente,presetDias,tipoRelatorio}){
  const [overview,setOverview]=useState(null);
  useEffect(()=>{
    if(!clienteId)return;
    setOverview(null);
    const to=new Date(),from=new Date(to.getTime()-presetDias*86400000);
    apiCall(`/api/admin/producers/${clienteId}/google-ads/overview?from=${from.toISOString()}&to=${to.toISOString()}`).then(setOverview);
  },[clienteId,presetDias]);
  if(!overview)return <div style={{color:MUTED,fontSize:13,textAlign:"center",padding:20}}>Carregando…</div>;
  const a=overview.atual,p=overview.anterior;
  const periodoLabel=`${new Date(overview.periodo.from).toLocaleDateString('pt-BR')} — ${new Date(overview.periodo.to).toLocaleDateString('pt-BR')}`;
  const TIPO_LABEL={semanal:"Relatório Semanal",quinzenal:"Relatório Quinzenal",mensal:"Relatório Mensal",trimestral:"Relatório Trimestral"};
  const conclusoes=[
    `${a.contatos} contato(s) chegaram nesse período.`,
    a.clientes>0?`${a.clientes} virou/viraram cliente${a.clientes>1?"s":""}.`:"Nenhum contato virou cliente ainda nesse período.",
    a.faturamento>0?`Isso gerou ${fmtBRL(a.faturamento)} em faturamento.`:null,
    a.contatos>=p.contatos?"O número de contatos cresceu em relação ao período anterior.":"O número de contatos caiu em relação ao período anterior — vale revisar o anúncio.",
  ].filter(Boolean);
  const linhas=[
    {label:"Investimento",v:overview.investimento!=null?fmtBRL(overview.investimento):null},
    {label:"Contatos",v:String(a.contatos)},
    {label:"Clientes",v:String(a.clientes)},
    {label:"Faturamento",v:fmtBRL(a.faturamento)},
  ].filter(r=>r.v!=null);
  const compartilhar=()=>{
    const texto=`${TIPO_LABEL[tipoRelatorio]} — ${cliente?.name}\n${periodoLabel}\n\n${linhas.map(l=>`${l.label}: ${l.v}`).join("\n")}`;
    if(navigator.share)navigator.share({title:"Relatório",text:texto}).catch(()=>{});
    else navigator.clipboard?.writeText(texto);
  };
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <style>{`@media print{.jp-bnav,.jp-sidebar,.jp-topbar{display:none !important}}`}</style>
      <div style={{background:CARD,border:`1px solid ${BDR}`,borderRadius:20,padding:"24px 20px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <Avatar url={cliente?.avatar_url} name={cliente?.name} size={40} radius={12}/>
          <div>
            <div style={{color:TEXT,fontWeight:800,fontSize:15}}>{cliente?.name}</div>
            <div style={{color:MUTED,fontSize:11}}>{TIPO_LABEL[tipoRelatorio]} · {periodoLabel}</div>
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:16}}>
          {linhas.map(r=>(
            <div key={r.label} style={{display:"flex",justifyContent:"space-between",padding:"10px 14px",background:CARD2,borderRadius:12}}>
              <span style={{color:MUTED,fontSize:12,fontWeight:600}}>{r.label}</span>
              <span style={{color:TEXT,fontSize:15,fontWeight:800}}>{r.v}</span>
            </div>
          ))}
        </div>
        <div style={{color:GOLD,fontSize:11,fontWeight:700,letterSpacing:"0.06em",textTransform:"uppercase",marginBottom:8}}>O que aconteceu</div>
        <ul style={{margin:"0 0 16px",padding:"0 0 0 18px",color:TEXT,fontSize:13,lineHeight:1.8}}>
          {conclusoes.map((c,i)=>(<li key={i}>{c}</li>))}
        </ul>
        {!overview.adsConnected&&<div style={{color:MUTED,fontSize:11,lineHeight:1.5}}>Investimento em anúncios aparece aqui depois que o Google Ads for conectado pra esse cliente.</div>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        <Btn sm outline onClick={()=>window.print()}>Exportar PDF</Btn>
        <Btn sm outline onClick={compartilhar}>Compartilhar</Btn>
      </div>
    </div>
  );
}

function GAIntegracao({clienteId,cliente,onUpdated}){
  const [status,setStatus]=useState(null);
  const [customerId,setCustomerId]=useState(cliente?.google_ads_customer_id||"");
  const [saving,setSaving]=useState(false);
  const [msg,setMsg]=useState("");
  useEffect(()=>{apiCall('/api/admin/google-ads/status').then(setStatus);},[]);
  useEffect(()=>{setCustomerId(cliente?.google_ads_customer_id||"");},[cliente?.id]);
  const conectar=async()=>{
    const d=await apiCall('/api/admin/google/connect');
    if(d?.url)window.open(d.url,'_blank');
  };
  const salvar=async()=>{
    setSaving(true);setMsg("");
    const d=await apiCall(`/api/admin/producers/${clienteId}/google-ads`,{method:'POST',body:JSON.stringify({customer_id:customerId.trim()})});
    setSaving(false);
    if(d?.error){setMsg(d.error);return;}
    setMsg("Salvo.");setTimeout(()=>setMsg(""),2000);
    onUpdated&&onUpdated();
  };
  if(!status)return null;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{color:TEXT,fontWeight:800,fontSize:17}}>Integração · Google Ads</div>
      <div style={{background:CARD,border:`1px solid ${BDR}`,borderRadius:20,padding:"18px"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:status.googleConnected?GREEN:MUTED,flexShrink:0}}/>
          <span style={{color:TEXT,fontSize:13,fontWeight:700}}>{status.googleConnected?`Conectado: ${status.googleEmail}`:"Conta Google não conectada"}</span>
        </div>
        <div style={{color:MUTED,fontSize:11,marginBottom:10,lineHeight:1.4}}>Mesma conexão Google usada pro sensor via Tag Manager — só precisa conectar uma vez.</div>
        <Btn sm outline onClick={conectar}>{status.googleConnected?"Reconectar (renovar permissões)":"Conectar Google"}</Btn>
      </div>
      <div style={{background:CARD,border:`1px solid ${BDR}`,borderRadius:20,padding:"18px"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:status.developerTokenConfigured?GREEN:MUTED,flexShrink:0}}/>
          <span style={{color:TEXT,fontSize:13,fontWeight:700}}>{status.developerTokenConfigured?"Developer Token configurado":"Developer Token pendente"}</span>
        </div>
        {!status.developerTokenConfigured&&<div style={{color:MUTED,fontSize:12,lineHeight:1.5}}>Esse token é pedido direto ao Google, dentro da própria conta de Google Ads (Ferramentas → Central de API). Depois de conseguir, me manda o token que eu configuro no servidor.</div>}
      </div>
      <div style={{background:CARD,border:`1px solid ${BDR}`,borderRadius:20,padding:"18px"}}>
        <div style={{color:MUTED,fontSize:10,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:8}}>Conta de Ads deste cliente</div>
        <div style={{color:MUTED,fontSize:12,marginBottom:10,lineHeight:1.5}}>Cole o ID da conta de Google Ads de <b style={{color:TEXT}}>{cliente?.name}</b> (formato 123-456-7890).</div>
        <input value={customerId} onChange={e=>setCustomerId(e.target.value)} placeholder="123-456-7890" style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"11px 14px",color:TEXT,fontSize:13,outline:"none",fontFamily:F,marginBottom:10}}/>
        <Btn sm outline onClick={salvar}>{saving?"Salvando…":"Salvar"}</Btn>
        {msg&&<div style={{color:MUTED,fontSize:11,marginTop:8}}>{msg}</div>}
      </div>
    </div>
  );
}

function GoogleAdsAdmin(){

      {screen==="palavras"&&<GAPalavrasChave clienteId={clienteId} cliente={cliente} onNav={onNav}/>}
      {screen==="relatorios"&&<GARelatorios cliente={cliente} presetDias={presetDias} setPresetDias={setPresetDias} tipoRelatorio={tipoRelatorio} setTipoRelatorio={setTipoRelatorio} onGerar={()=>setScreen("relatoriogerado")}/>}

              <input value={fDownsell} onChange={e=>setFDownsell(e.target.value)} disabled={!fUpsell.trim()} placeholder="https://..." style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:10,padding:"10px 12px",color:fUpsell.trim()?TEXT:"rgba(255,255,255,0.2)",fontSize:13,outline:"none",fontFamily:F,cursor:fUpsell.trim()?"text":"not-allowed"}}/>

            {funnelMsg&&<div style={{fontSize:12,color:funnelMsg==="Salvo!"?GREEN:RED}}>{funnelMsg}</div>}

            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>

            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{color:MUTED,fontSize:12}}>Obrigado</span>
              <span style={{color:fObrigado?TEXT:MUTED,fontSize:12,maxWidth:"60%",textAlign:"right",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{fObrigado||"Padrão JosephPay"}</span>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{color:MUTED,fontSize:12}}>Downsell</span>

            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{color:MUTED,fontSize:12}}>GTM</span>
              <span style={{color:fGtm?GOLD:MUTED,fontSize:12,fontWeight:fGtm?700:400}}>{fGtm||"Não configurado"}</span>
            </div>
            {funnelMsg&&<div style={{fontSize:12,color:GREEN}}>{funnelMsg}</div>}
          </div>
        )}
      </div>
      {/* Zona crítica — excluir produto */}
      <div style={{background:CARD,border:"1px solid rgba(239,68,68,0.2)",borderRadius:20,padding:"20px 18px",marginTop:8}}>

          {deleting?"Excluindo…":"Excluir produto"}
        </button>
      </div>
    </div>
  );
}

function CriarProdutoModal({onClose,onCreated,ownerId}){
  const [nome,setNome]=useState("");
  const [preco,setPreco]=useState("");
  const [desc,setDesc]=useState("");
  const [tipo,setTipo]=useState("UNDEFINED");
  const [ciclo,setCiclo]=useState("MONTHLY");
  const [upsellUrl,setUpsellUrl]=useState("");
  const [downsellUrl,setDownsellUrl]=useState("");
  const [obrigadoUrl,setObrigadoUrl]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [created,setCreated]=useState(false); // boolean — produto foi criado
  const [link,setLink]=useState("");           // URL do checkout (pode ser vazia)
  const [copied,setCopied]=useState(false);
  const criar=async()=>{
    if(!nome||!preco){setError("Preencha nome e preço.");return;}
    setError("");setLoading(true);
    const val=parseFloat(preco.replace(/\./g,"").replace(",","."));
    if(isNaN(val)||val<=0){setError("Preço inválido.");setLoading(false);return;}
    const d=await apiCall(ownerId?'/api/admin/products':'/api/products/create',{method:'POST',body:JSON.stringify({name:nome,description:desc,price:val,billingType:tipo,subscriptionCycle:tipo==="RECURRENT"?ciclo:undefined,upsellUrl:upsellUrl.trim()||undefined,downsellUrl:(upsellUrl.trim()&&downsellUrl.trim())?downsellUrl.trim():undefined,obrigadoUrl:obrigadoUrl.trim()||undefined,owner_id:ownerId||undefined})});
    setLoading(false);
    if(d.error){setError(d.error);return;}
    if(!d.paymentUrl){setError("Link não foi gerado. Verifique os logs do Railway e tente novamente.");return;}
    setLink(`https://josephpay.com/checkout.html?p=${d.product.id}`);
    setCreated(true);
    if(onCreated) onCreated();
  };
  const copiar=()=>{
    if(!link)return;
    navigator.clipboard?.writeText(link).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  };
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",backdropFilter:"blur(6px)",WebkitBackdropFilter:"blur(6px)",zIndex:200,display:"flex",alignItems:"flex-end"}}>
      <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:480,margin:"0 auto",background:CARD,borderRadius:"24px 24px 0 0",padding:"12px 24px 40px",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{width:32,height:4,borderRadius:2,background:"rgba(255,255,255,0.15)",margin:"0 auto 20px"}}/>
        {created?(
          <div style={{textAlign:"center",padding:"20px 0 10px"}}>
            <div style={{color:GREEN,fontSize:40,marginBottom:12}}>✓</div>
            <div style={{color:TEXT,fontWeight:800,fontSize:18,marginBottom:8}}>Produto criado!</div>
            <div style={{color:MUTED,fontSize:13,marginBottom:20}}>Já aparece na sua lista de produtos.</div>
            {link?(
              <div style={{background:CARD2,border:`1px solid ${BDR}`,borderRadius:14,padding:"14px 16px",marginBottom:20}}>
                <div style={{color:MUTED,fontSize:10,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:8}}>Link de checkout</div>
                <div style={{color:GOLD,fontSize:12,fontWeight:600,wordBreak:"break-all",marginBottom:12,lineHeight:1.5}}>{link}</div>
                <button onClick={copiar} style={{width:"100%",background:copied?`${GREEN}18`:GOLD,border:copied?`1px solid ${GREEN}40`:"none",borderRadius:100,padding:"12px",color:copied?GREEN:"#0C0C0C",fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:F,transition:"all 0.2s"}}>
                  {copied?"✓ Copiado!":"Copiar link"}
                </button>
              </div>
            ):(
              <div style={{background:"rgba(255,255,255,0.04)",border:`1px solid ${BDR}`,borderRadius:14,padding:"14px 16px",marginBottom:20}}>
                <div style={{color:MUTED,fontSize:13}}>Link sendo gerado… veja em Gerenciar produto.</div>
              </div>
            )}
            <button onClick={onClose} style={{width:"100%",background:"transparent",border:`1.5px solid ${BDR}`,borderRadius:100,padding:14,color:MUTED,fontWeight:600,fontSize:14,cursor:"pointer",fontFamily:F}}>Fechar</button>
          </div>
        ):(
          <>
            <div style={{color:TEXT,fontWeight:800,fontSize:18,marginBottom:20}}>Novo produto</div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div>
                <div style={{color:MUTED,fontSize:10,fontWeight:600,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:6}}>Nome do produto *</div>
                <input value={nome} onChange={e=>setNome(e.target.value)} placeholder="Ex: Protocolo G9" style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"13px 14px",color:TEXT,fontSize:15,outline:"none",fontFamily:F}}/>
              </div>
              <div>
                <div style={{color:MUTED,fontSize:10,fontWeight:600,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:6}}>Preço (R$) *</div>

                </div>

function gerarSenhaLocal(){
  const bytes=new Uint8Array(9);
  (window.crypto||window.msCrypto).getRandomValues(bytes);
  return btoa(String.fromCharCode(...bytes)).replace(/[+/=]/g,"x");
}

function CopyField({label,value,mono}){
  const [copied,setCopied]=useState(false);
  const copiar=()=>{
    if(!value)return;
    navigator.clipboard?.writeText(value).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  };
  return(
    <div style={{background:CARD2,border:`1px solid ${BDR}`,borderRadius:14,padding:"12px 14px",marginBottom:10,position:"relative"}}>
      <div style={{color:MUTED,fontSize:10,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:6}}>{label}</div>
      <div style={{color:GOLD,fontSize:mono?12:13,fontWeight:600,wordBreak:"break-all",paddingRight:70,fontFamily:mono?"monospace":F,whiteSpace:mono?"pre-wrap":"normal"}}>{value}</div>
      <button onClick={copiar} style={{position:"absolute",top:10,right:10,background:copied?`${GREEN}18`:GOLD,border:copied?`1px solid ${GREEN}40`:"none",borderRadius:8,padding:"5px 10px",color:copied?GREEN:"#0C0C0C",fontWeight:700,fontSize:11,cursor:"pointer"}}>{copied?"✓":"Copiar"}</button>
    </div>
  );
}

    if(!msgText.trim()||sending)return;

    setSending(true);
    try{

      const payload=channel==='email'
        ?{message:msgText.trim(),subject:emailSubject.trim(),group:groupMap[group]||'todos',excludedIds:[...excluded]}
        :{message:msgText.trim(),group:groupMap[group]||'todos',excludedIds:[...excluded]};
      const res=await apiCall(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});

  function exportCSV(){
    if(!clientes||!clientes.length)return;
    const esc=v=>`"${String(v||'').replace(/"/g,'""')}"`;
    const hdr='Nome,Telefone,E-mail,Status,Origem,Aniversário,Data cadastro';
    const rows=clientes.map(c=>[esc(c.name),esc(c.phone),esc(c.email),esc(stLabel(c.status)),esc(srcLabel(c.source)),esc(c.birthday?new Date(c.birthday).toLocaleDateString('pt-BR'):''),esc(new Date(c.created_at).toLocaleDateString('pt-BR'))].join(','));
    const blob=new Blob([[hdr,...rows].join('\n')],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clientes.csv';a.click();
  }
  function parseCSVLine(line){
    const res=[];let cur='';let inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}
      else if(ch===','&&!inQ){res.push(cur.trim());cur='';}
      else cur+=ch;
    }
    res.push(cur.trim());return res;
  }
  async function importCSV(file){
    if(!file)return;
    const text=await file.text();
    const lines=text.split(/\r?\n/).filter(Boolean);
    if(!lines.length)return;
    const hdrLine=lines[0].toLowerCase();
    const isOurFormat=hdrLine.includes('nome')&&hdrLine.includes('telefone');
    const start=isOurFormat?1:0;
    const rows=[];
    for(let i=start;i<lines.length;i++){
      const cols=parseCSVLine(lines[i]);
      if(!cols[0])continue;
      rows.push({name:cols[0]||'',phone:cols[1]||'',email:cols[2]||'',birthday:cols[3]||''});
    }
    if(!rows.length)return;
    try{
      const {data:s}=await _sb.auth.getSession();
      const res=await apiCall('/api/customers/import',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.session?.access_token}`},body:JSON.stringify({customers:rows})});
      if(res?.inserted>0){
        // recarrega lista
        _sb.from('customers').select('*,sales(amount,producer_amount,status,created_at,product_id)').is('deleted_at',null).order('created_at',{ascending:false})
          .then(({data})=>{if(data)setClientes(data);});
        alert(`${res.inserted} cliente(s) importado(s) com sucesso!`);
      }else{alert('Nenhum cliente novo importado.');}
    }catch(e){console.error('[import]',e);alert('Erro ao importar.');}
  }

          <div className="vars-wrap">

          </div>
          <div className="chat-bar">
            <textarea className="chat-ta" value={msgText} onChange={e=>setMsgText(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(msgText.trim())sendMsg();}}} placeholder="Mensagem..." rows={1}/>
            <div className={`mic-send${msgText.trim()?' send':' mic'}`} onClick={msgText.trim()?sendMsg:undefined}>

                ?<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13" stroke="white" strokeWidth="2.1" strokeLinecap="round"/><path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" strokeWidth="2.1" strokeLinecap="round" strokeLinejoin="round"/></svg>
                :<svg width="12" height="16" viewBox="0 0 12 16" fill="none"><rect x="3" y=".75" width="6" height="8.5" rx="3" stroke="currentColor" strokeWidth="1.4"/><path d="M1 8a5 5 0 0010 0" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/><line x1="6" y1="13" x2="6" y2="15.25" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>}
            </div>
          </div>

      {tab===0&&(

            <button id="btn-adicionar-lead" className="sa" onClick={()=>setShowAdd(true)}>+ Adicionar</button>

            <input id="csv-import-input" type="file" accept=".csv" style={{display:"none"}} onChange={e=>{importCSV(e.target.files[0]);e.target.value='';}}/>
            <button id="btn-exportar-leads" className="sa" onClick={exportCSV}>Exportar</button>
          </div>
          <div className="segs">
            {[{id:'todos',label:'Todos',count:totalClientes},{id:'lead',label:'Interessados',count:cnts.lead},{id:'cliente',label:'Clientes',count:cnts.cliente},{id:'assinante',label:'Assinantes',count:cnts.assinante}].map(f=>(
              <div key={f.id} className={`seg${filtro===f.id?' on':''}`} onClick={()=>setFiltro(f.id)}>{f.label}<span className="sn">{f.count}</span></div>

                <div className="ci-i" style={{flex:1}}>
                  <div className="sk" style={{height:13,width:"52%",borderRadius:6,marginBottom:6}}/>
                  <div className="sk" style={{height:10,width:"36%",borderRadius:6}}/>
                </div>
              </div>
            ))}
            {clientes!==null&&listaFiltrada.length===0&&<div style={{padding:'20px',textAlign:'center',color:'var(--t2)',fontSize:13}}>Nenhum cliente neste grupo.</div>}
            {listaFiltrada.map((c,i)=>{
              const ls2=c.sales?.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0];
              const uc2=ls2?new Date(ls2.created_at).toLocaleDateString('pt-BR'):'—';
              const idx2=(clientes||[]).findIndex(x=>x.id===c.id);
              return(
                <div key={c.id||i} className="ci" onClick={()=>setSel(idx2)}>
                  <div className="cav">{inits(c.name)}</div>
                  <div className="ci-i"><div className="cn">{c.name}</div><div className="cs">{c.phone||c.email||'—'} · {new Date(c.created_at).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</div></div>
                  <div className="cr"><div className="cv">{fmtBRL(c.total_spent||calcSpent(c))}</div><div className="ct">{stLabel(c.status||'cliente')}</div></div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {showNova&&<div className="ov" onClick={e=>{if(e.target===e.currentTarget)setShowNova(false);}}><div className="sh"><div className="sh-h"/><div className="sh-t">Nova ação</div><div className="sh-s">O que você quer fazer?</div><button className="shop gd" onClick={()=>{setShowNova(false);setTab(2);}}><div className="sh-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="rgba(0,0,0,.6)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg></div>Enviar mensagem ao grupo</button><button className="shop" onClick={()=>{setShowNova(false);setShowAdd(true);}}><div className="sh-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" strokeWidth="1.8"/><line x1="19" y1="8" x2="19" y2="14" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/><line x1="22" y1="11" x2="16" y2="11" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg></div>Adicionar contato</button><button className="shop"><div className="sh-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/><polyline points="17 8 12 3 7 8" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/><line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg></div>Importar lista</button></div></div>}
      {showAdd&&<div className="ov" onClick={e=>{if(e.target===e.currentTarget)setShowAdd(false);}}><div className="sh"><div className="sh-h"/><div className="sh-t">Adicionar contato</div><div className="sh-s">Preencha os dados</div>{[{k:'name',l:'Nome completo',p:'Nome',t:'text'},{k:'phone',l:'Telefone (WhatsApp)',p:'(XX) XXXXX-XXXX',t:'tel'},{k:'email',l:'E-mail',p:'email@email.com',t:'email'},{k:'birthday',l:'Data de nascimento',p:'',t:'date'}].map(f=><div key={f.k} className="shf"><div className="shl">{f.l}</div><input className="shin" type={f.t} placeholder={f.p} value={form[f.k]} onChange={e=>setForm(p=>({...p,[f.k]:e.target.value}))}/></div>)}<button className="shbtn" onClick={salvarCliente} disabled={saving||!form.name.trim()}>{saving?'Salvando…':'Salvar'}</button></div></div>}

    </div>
  );
}

function DisparosTab({onWapChange,onEmailChange}){
  const [wapStatus,setWapStatus]=useState("verificando");
  const [emailStatus,setEmailStatus]=useState('verificando');
  const [emailInfo,setEmailInfo]=useState(null);
  const [qrCode,setQrCode]=useState(null);
  const [qrLoading,setQrLoading]=useState(false);
  const [pairingPhone,setPairingPhone]=useState('');
  const [pairingCountry,setPairingCountry]=useState('55');
  const [pairingCode,setPairingCode]=useState(null);
  const [pairingMode,setPairingMode]=useState(false);
  const [showDisp,setShowDisp]=useState(false);
  const [clientes,setClientes]=useState(null);
  const [showAllBdays,setShowAllBdays]=useState(false);
  const [disparos,setDisparos]=useState([
    {name:"Aniversário",on:false,live:false,open:false,msg:"Feliz aniversário, {nome}! Aqui vai um presentinho especial para você.",dias:"",hora:"09:00",canal:"whatsapp"},
    {name:"Cashback",on:false,live:false,open:false,msg:"Oi {nome}, você tem cashback esperando! Use hoje.",dias:"7",hora:"09:00",canal:"whatsapp"},
    {name:"Pós-compra",on:false,live:false,open:false,msg:"Olá {nome}! Como foi sua experiência?",dias:"3",hora:"09:00",canal:"whatsapp"},
  ]);
  const [showEmailConnect,setShowEmailConnect]=useState(false);
  const [emailForm,setEmailForm]=useState({host:'',port:'587',user:'',pass:'',fromName:''});
  const [emailConnecting,setEmailConnecting]=useState(false);
  const [emailConnectError,setEmailConnectError]=useState('');

  useEffect(()=>{
    apiCall('/api/whatsapp/status').then(d=>setWapStatus(d?.connected?'conectado':'desconectado')).catch(()=>setWapStatus('desconectado'));
  },[]);
  useEffect(()=>{ if(onWapChange)onWapChange(wapStatus==='conectado'); },[wapStatus]);
  useEffect(()=>{
    apiCall('/api/email/status').then(d=>{setEmailStatus(d?.connected?'conectado':'desconectado');setEmailInfo(d?.connected?{email:d.email,fromName:d.fromName}:null);}).catch(()=>setEmailStatus('desconectado'));
  },[]);
  useEffect(()=>{ if(onEmailChange)onEmailChange(emailStatus==='conectado'); },[emailStatus]);
  useEffect(()=>{
    if(!_sb)return;
    _sb.auth.getSession().then(({data})=>{
      if(!data.session)return;
      apiCall('/api/user/disparos',{headers:{'Authorization':`Bearer ${data.session.access_token}`}})
        .then(d=>{if(Array.isArray(d))setDisparos(d.map(x=>({...x,open:false})));}).catch(()=>{});
    });
  },[]);
  useEffect(()=>{
    if(!qrCode)return;
    const iv=setInterval(async()=>{
      const d=await apiCall('/api/whatsapp/status').catch(()=>null);
      if(d?.connected){setWapStatus('conectado');setQrCode(null);clearInterval(iv);}
    },3000);
    return()=>clearInterval(iv);
  },[qrCode]);
  useEffect(()=>{
    if(!pairingCode)return;
    const iv=setInterval(async()=>{
      const d=await apiCall('/api/whatsapp/status').catch(()=>null);
      if(d?.connected){
        setWapStatus('conectado');
        onWapChange&&onWapChange(true);
        setQrCode(null);setPairingMode(false);setPairingCode(null);setPairingPhone('');setPairingCountry('55');
        clearInterval(iv);
      }
    },3000);
    return()=>clearInterval(iv);
  },[pairingCode]);
  useEffect(()=>{
    if(!_sb)return;
    _sb.from('customers').select('id,name,birthday').is('deleted_at',null)
      .then(({data})=>{if(data)setClientes(data);});
  },[]);
  const inits=n=>n?n.trim().split(/\s+/).map(w=>w[0]).join('').toUpperCase().slice(0,2):'?';
  const MO=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const todayMid=(()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());})();
  const anivs=(clientes||[]).filter(c=>c.birthday).map(c=>{
    const b=new Date(c.birthday+'T00:00:00');
    const nx=new Date(todayMid.getFullYear(),b.getMonth(),b.getDate());
    if(nx<todayMid)nx.setFullYear(todayMid.getFullYear()+1);
    const dias=Math.round((nx-todayMid)/864e5);
    const label=dias===0?'hoje':dias===1?'amanhã':`${b.getDate()} ${MO[b.getMonth()]}`;
    return{...c,dias,label,inits:inits(c.name)};
  }).sort((a,b)=>a.dias-b.dias).slice(0,10);
  async function connectEmail(){
    setEmailConnecting(true);setEmailConnectError('');
    try{
      const {data:s}=await _sb.auth.getSession();
      const res=await apiCall('/api/email/connect',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.session?.access_token}`},body:JSON.stringify(emailForm)});
      if(res?.connected){setEmailStatus('conectado');setEmailInfo({email:res.email,fromName:emailForm.fromName});setShowEmailConnect(false);setEmailForm({host:'',port:'587',user:'',pass:'',fromName:''});}
      else{setEmailConnectError(res?.error||'Erro ao conectar.');}
    }catch(e){setEmailConnectError(e.message||'Erro ao conectar.');}
    setEmailConnecting(false);
  }
  const connectWhatsApp=async()=>{
    setQrLoading(true);
    try{
      const d=await apiCall('/api/whatsapp/qr');
      if(d?.code) setQrCode(d.code);
      else if(d?.connected) setWapStatus('conectado');
      else if(d?.error) alert('Erro ao conectar WhatsApp: '+d.error);
    }catch(e){console.error(e);alert('Erro ao conectar: '+e.message);}
    setQrLoading(false);
  };
  async function salvarDisparos(idx){
    try{
      const {data:s}=await _sb.auth.getSession();
      await apiCall('/api/user/disparos',{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.session?.access_token}`},body:JSON.stringify(disparos)});
    }catch(e){console.error('[salvar-disparos]',e);}
  }
  const togTgl=i=>setDisparos(p=>p.map((d,j)=>j===i?{...d,on:!d.on}:d));
  const togPause=i=>setDisparos(p=>p.map((d,j)=>j===i?{...d,live:!d.live}:d));
  return(
    <div className="crm-v9">
      <div className="scr">
        <div className={`wab${wapStatus==='conectado'?' on':' off'}`}>
          <div className={`wdot${wapStatus==='conectado'?' g':' r'}`}/>
          <div><div className="wlbl">WhatsApp</div><div className="wval">{wapStatus==='conectado'?'Conectado':'Desconectado'}</div></div>
          <button id="btn-conectar-whatsapp" className="wcb" onClick={wapStatus==='conectado'?()=>apiCall('/api/whatsapp/status').then(d=>setWapStatus(d?.connected?'conectado':'desconectado')):connectWhatsApp} disabled={qrLoading}>{qrLoading?'Aguarde…':wapStatus==='conectado'?'Verificar':'Conectar'}</button>
        </div>
        <div className={`wab${emailStatus==='conectado'?' on':' off'}`}>

  const CLIENTS=[{name:"Renato G9",email:"renato@g9.com"},{name:"Dra. Deise",email:"deise@clinica.com"}];
  const isAdminMode=typeof window!=="undefined"&&(window.location.search.includes("admin=1") || window.location.pathname.includes("/admin"));

  const doLogin=async()=>{
    if(!email||!pass){setError("Preencha e-mail e senha.");return;}
    setError("");setLoading(true);
    if(_sb){
      const{data,error:err}=await _sb.auth.signInWithPassword({email,password:pass});
      setLoading(false);
      if(err){setError(err.message==="Invalid login credentials"?"E-mail ou senha incorretos.":err.message);return;}

      onLogin({role:meta.role||(role==="admin"?"admin":"client"),name:meta.name||email.split("@")[0],email,id:data.user.id});

      // Demo mode — funciona sem Supabase configurado

    }
  };

  const doReset=async()=>{
    if(!email){setError("Digite seu e-mail antes de recuperar a senha.");return;}

// ── Paywall: aparece quando o usuário sem assinatura tenta usar chat/disparo ──
// Escuta o evento "jp:paywall" disparado pelo apiCall ao receber 402 do backend.
function Paywall(){
  const [open,setOpen]=useState(false);
  const [tab,setTab]=useState("pix");         // "pix" | "cartao"
  const [cpf,setCpf]=useState("");
  const [pix,setPix]=useState(null);          // {pixQrCode, pixCopyCola}
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");
  const [paid,setPaid]=useState(false);
  const pollRef=useRef(null);

  useEffect(()=>{
    const onEvt=()=>{setOpen(true);};
    window.addEventListener("jp:paywall",onEvt);
    return()=>window.removeEventListener("jp:paywall",onEvt);
  },[]);

  // Enquanto o PIX está gerado, verifica a cada 4s se o pagamento caiu → libera na hora
  useEffect(()=>{
    if(!pix)return;
    pollRef.current=setInterval(async()=>{
      const s=await apiCall("/api/subscription/status");
      if(s?.active){clearInterval(pollRef.current);setPaid(true);setTimeout(()=>location.reload(),1800);}
    },4000);
    return()=>clearInterval(pollRef.current);
  },[pix]);

  const close=()=>{setOpen(false);setPix(null);setErr("");setPaid(false);setCpf("");};

  const gerarPix=async()=>{
    setErr("");
    if(cpf.replace(/\D/g,"").length<11){setErr("Digite um CPF válido.");return;}
    setLoading(true);
    const r=await apiCall("/api/subscription/pix",{method:"POST",body:JSON.stringify({cpf})});
    setLoading(false);
    if(r?.error){setErr(r.error);return;}
    setPix(r);
  };
  const assinarCartao=async()=>{
    setErr("");setLoading(true);
    const r=await apiCall("/api/subscription/card",{method:"POST",body:JSON.stringify({})});
    setLoading(false);
    if(r?.error){setErr(r.error);return;}
    if(r?.init_point)location.href=r.init_point;
  };

  if(!open)return null;
  const box={background:CARD,border:`1px solid ${BDR}`,borderRadius:16,padding:24,width:"100%",maxWidth:420,color:TEXT,fontFamily:F,maxHeight:"90vh",overflowY:"auto"};
  const btn=(bg)=>({background:bg,color:"#131312",border:"none",borderRadius:10,padding:"13px 16px",fontWeight:700,fontSize:15,cursor:"pointer",width:"100%",fontFamily:F});
  const tabBtn=(active)=>({flex:1,background:active?GOLD:"transparent",color:active?"#131312":MUTED,border:`1px solid ${active?GOLD:BDR}`,borderRadius:9,padding:"9px 0",fontWeight:600,fontSize:14,cursor:"pointer",fontFamily:F});
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",zIndex:9999,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={close}>
      <div style={box} onClick={e=>e.stopPropagation()}>
        {paid?(
          <div style={{textAlign:"center",padding:"20px 0"}}>
            <div style={{fontSize:44}}>✅</div>
            <div style={{fontSize:20,fontWeight:700,marginTop:10}}>Pagamento confirmado!</div>
            <div style={{color:MUTED,marginTop:6,fontSize:14}}>Liberando seu acesso…</div>
          </div>
        ):(<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div style={{fontFamily:SF,fontSize:22,fontWeight:600}}>Assine o Joseph<span style={{color:GOLD}}>Pay</span></div>
            <button onClick={close} style={{background:"none",border:"none",color:MUTED,fontSize:22,cursor:"pointer",lineHeight:1}}>×</button>
          </div>
          <div style={{color:MUTED,fontSize:14,marginTop:8,lineHeight:1.5}}>
            Seu período grátis acabou. Continue usando o chat de IA, os disparos e todas as ferramentas por <b style={{color:TEXT}}>R$30/mês</b>.
          </div>

          {!pix&&(
            <div style={{display:"flex",gap:8,margin:"18px 0 16px"}}>
              <button style={tabBtn(tab==="pix")} onClick={()=>{setTab("pix");setErr("");}}>PIX</button>
              <button style={tabBtn(tab==="cartao")} onClick={()=>{setTab("cartao");setErr("");}}>Cartão · automático</button>
            </div>
          )}

          {err&&<div style={{background:"#EF444422",color:"#FCA5A5",padding:"9px 12px",borderRadius:8,fontSize:13,marginBottom:12}}>{err}</div>}

          {tab==="pix"&&!pix&&(
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <input value={cpf} onChange={e=>setCpf(e.target.value)} placeholder="Seu CPF" inputMode="numeric"
                style={{background:CARD2,border:`1px solid ${BDR}`,borderRadius:10,padding:"12px 14px",color:TEXT,fontSize:15,fontFamily:F,outline:"none"}}/>
              <button style={btn(GOLD)} disabled={loading} onClick={gerarPix}>{loading?"Gerando…":"Gerar PIX de R$30"}</button>
              <div style={{color:MUTED,fontSize:12,textAlign:"center"}}>PIX avulso — renove todo mês para manter o acesso.</div>
            </div>
          )}

          {tab==="pix"&&pix&&(
            <div style={{display:"flex",flexDirection:"column",gap:12,alignItems:"center"}}>
              {pix.pixQrCode&&<img src={`data:image/png;base64,${pix.pixQrCode}`} alt="QR Code PIX" style={{width:220,height:220,borderRadius:10,background:"#fff",padding:8}}/>}
              {pix.pixCopyCola&&(
                <button style={{...btn(CARD3),color:TEXT,fontSize:13}} onClick={()=>{navigator.clipboard?.writeText(pix.pixCopyCola);}}>
                  📋 Copiar código PIX (copia e cola)
                </button>
              )}
              <div style={{color:MUTED,fontSize:13,textAlign:"center"}}>Aguardando pagamento… o acesso libera sozinho assim que o PIX cair.</div>
            </div>
          )}

          {tab==="cartao"&&(
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div style={{background:CARD2,border:`1px solid ${BDR}`,borderRadius:10,padding:14,fontSize:13,color:MUTED,lineHeight:1.5}}>
                <b style={{color:GOLD}}>1º mês grátis</b>, depois <b style={{color:TEXT}}>R$30/mês</b> automático no cartão.
                Você autoriza uma vez e o Mercado Pago cobra sozinho — cancele quando quiser. O cartão fica no cofre do Mercado Pago.
              </div>
              <button style={btn(GOLD)} disabled={loading} onClick={assinarCartao}>{loading?"Abrindo…":"Assinar no cartão"}</button>
            </div>
          )}
        </>)}
      </div>
    </div>
  );
}

function App(){
  const [user,setUser]=useState(null);
  const [booting,setBooting]=useState(true);

  useEffect(()=>{
    if(_sb){
      // Supabase configurado → restaura sessão real
      _sb.auth.getSession().then(({data:{session}})=>{
        if(session){
          const m=session.user.user_metadata||{};
          setUser({role:m.role||"client",name:m.name||session.user.email.split("@")[0],email:session.user.email,id:session.user.id});
        }
        setBooting(false);
      });
      const{data:{subscription}}=_sb.auth.onAuthStateChange((_ev,session)=>{
        if(!session)setUser(null);
      });
      return()=>subscription.unsubscribe();
    } else {
      // Sem Supabase → usa localStorage para persistência de demo
      try{const s=localStorage.getItem("jp_session");if(s)setUser(JSON.parse(s));}catch(e){}
      setBooting(false);
    }
  },[]);

  const handleLogin=(u)=>{
    setUser(u);
    if(!_sb)localStorage.setItem("jp_session",JSON.stringify(u));
  };
  const handleLogout=()=>{
    setUser(null);
    if(_sb)_sb.auth.signOut();
    else localStorage.removeItem("jp_session");
  };

  if(booting)return(
    <div style={{background:BG,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <div style={{color:TEXT,fontFamily:SF,fontWeight:600,fontSize:28}}>Joseph<span style={{color:GOLD}}>Pay</span></div>
      <div style={{width:32,height:32,border:`3px solid ${GOLD}30`,borderTop:`3px solid ${GOLD}`,borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );

  return(
    <div style={{background:BG,minHeight:"100vh",fontFamily:F}}>
      {!user&&<Login onLogin={handleLogin}/>}
      {user?.role==="admin"&&<AdminPanel onLogout={handleLogout} userEmail={user.email}/>}
      {(user?.role==="client"||user?.role==="afiliado")&&<ClientPanel clientName={user.name} userEmail={user.email} onLogout={handleLogout}/>}
      {user&&<Paywall/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
