.crm-v9{--bg:#131312;--c1:#1a1a19;--c2:#222220;--c3:#2a2a28;--ln:rgba(255,255,255,0.055);--ln2:rgba(255,255,255,0.1);--gd:#D4AF37;--gd2:rgba(212,175,55,0.12);--tx:#E5E2E0;--t2:rgba(229,226,224,0.55);--t3:rgba(229,226,224,0.25);--gr:#34c759;--rd:#ff3b30;--wa:#142219;--wa2:#1c2f22}

.crm-v9 .kv.gd{color:var(--gd)}
.crm-v9 .bday-msgs-card{background:var(--c1);border-radius:14px;overflow:hidden;margin-bottom:12px}

.crm-v9 .ci-i{flex:1;min-width:0}.crm-v9 .cn{font-size:13px;font-weight:600;margin-bottom:2px}

.crm-v9 .cr{flex-shrink:0;text-align:right}.crm-v9 .cv{font-size:13px;font-weight:600;margin-bottom:2px}.crm-v9 .ct{font-size:10px;color:var(--t3)}
.crm-v9 .det{padding:4px 0 24px}
.crm-v9 .back{display:flex;align-items:center;gap:4px;padding:10px 0 14px;color:var(--gd);font-size:14px;cursor:pointer}

.crm-v9 .ptop{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}

.crm-v9 .pct{font-size:12px;color:var(--t2);line-height:1.8}
.crm-v9 .ptags{display:flex;gap:6px;flex-wrap:wrap}

.crm-v9 .qb{background:var(--c1);border-radius:10px;padding:11px 4px 9px;text-align:center;cursor:pointer;border:1px solid var(--ln)}

.crm-v9 .qi{display:flex;justify-content:center;margin-bottom:4px;color:var(--t2)}.crm-v9 .ql{font-size:10px;color:var(--t2)}

.crm-v9 .hp{font-size:13px;font-weight:600;margin-bottom:5px}
.crm-v9 .hcs{display:flex;gap:5px;flex-wrap:wrap}

.crm-v9 .hc.ok{color:var(--gr)}
.crm-v9 .chat-top{padding:10px 0;border-bottom:1px solid var(--ln);margin-bottom:10px}

<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef}=React;
const {AreaChart,Area,XAxis,YAxis,Tooltip,ResponsiveContainer,CartesianGrid,BarChart,Bar}=Recharts;

const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxqcGphZHd2cW9jYXRucWp2dXZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMTg4MzgsImV4cCI6MjA5MTg5NDgzOH0.cflTLbryotX4p84pA2L03J1VHmVCELTvJ0WwI5WeZeY";   // ex: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

// ── Railway + helpers ────────────────────────────────────────────────────────
const RAILWAY=(['localhost','127.0.0.1'].includes(location.hostname))?'':'https://josephpay-production.up.railway.app';
const fmtBRL=(v)=>`R$ ${Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const fmtLastLogin=(iso)=>{
  if(!iso)return"nunca acessou";
  const d=new Date(iso),now=new Date();
  // Compara pelo dia do calendário (não por "últimas 24h"), senão um acesso de ontem à
  // noite aparece como "hoje" só porque ainda não completou 24h corridas.
  const meiaNoite=x=>{const y=new Date(x);y.setHours(0,0,0,0);return y;};
  const dias=Math.round((meiaNoite(now)-meiaNoite(d))/86400000);
  if(dias===0)return`hoje às ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  if(dias===1)return`ontem às ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  if(dias<30)return`há ${dias} dias`;
  return d.toLocaleDateString('pt-BR');
};
const getToken=async()=>{if(!_sb)return null;const{data:{session}}=await _sb.auth.getSession();return session?.access_token||null;};
const apiCall=async(path,opts={})=>{try{const token=await getToken();const res=await fetch(`${RAILWAY}${path}`,{...opts,headers:{"Content-Type":"application/json",...(token?{Authorization:`Bearer ${token}`}:{}),...(opts.headers||{})},body:opts.body});const json=await res.json();if(res.status===402||json?.error==="subscription_required"){window.dispatchEvent(new CustomEvent("jp:paywall",{detail:json}));}return json;}catch(e){console.error("[api]",path,e.message);return{error:e.message};}};
// ─────────────────────────────────────────────────────────────────────────────

const GOLD="#D4AF37", GOLD2="#F2CA50", GREEN="#22C55E", RED="#EF4444", BLUE="#5B8DEF";
const BG="#131312", CARD="#1C1C1A", CARD2="#20201E", CARD3="#2A2A29";
const BDR="rgba(255,255,255,0.06)", MUTED="#B0A894", TEXT="#F2EFEA";
const F="'Inter',system-ui,sans-serif", SF="'Newsreader',Georgia,serif";

const mkData=(n,base,variance)=>Array.from({length:n},(_,i)=>({i,v:Math.max(0,base+Math.floor((Math.random()-0.4)*variance))}));
const PERIODS={
  hoje:{data:mkData(8,320,300).map((d,i)=>({...d,label:`${8+i}h`})),label:"Hoje"},
  semana:{data:mkData(7,800,700).map((d,i)=>({...d,label:["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"][i]})),label:"Esta semana"},
  mes:{data:mkData(30,600,800).map((d,i)=>({...d,label:i+1})),label:"Este mês"},
  trimestre:{data:mkData(12,2000,2000).map((d,i)=>({...d,label:`S${i+1}`})),label:"Trimestre"},
  ano:{data:mkData(12,8000,6000).map((d,i)=>({...d,label:["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"][i]})),label:"Ano"},
};

function Avatar({url,name,size=38,radius=12,fontSize=14}){
  return url
    ?<img src={url} style={{width:size,height:size,borderRadius:radius,objectFit:"cover",flexShrink:0,border:`1px solid ${BDR}`}}/>
    :<div style={{width:size,height:size,borderRadius:radius,background:CARD3,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize,color:TEXT,flexShrink:0}}>{(name||"?")[0]?.toUpperCase()}</div>;
}

function Tag({status}){
  if(status==="pago") return <span style={{fontSize:10,fontWeight:600,color:"#22C55E",letterSpacing:"0.06em",textTransform:"uppercase"}}>{status}</span>;
  if(status==="pendente") return <span style={{fontSize:10,fontWeight:600,color:MUTED,letterSpacing:"0.06em",textTransform:"uppercase"}}>{status}</span>;
  if(status==="estornado") return <span style={{fontSize:10,fontWeight:600,color:RED,letterSpacing:"0.06em",textTransform:"uppercase"}}>{status}</span>;
  const m={cancelado:{bg:"rgba(255,68,68,0.1)",tx:RED,bd:"rgba(255,68,68,0.2)"},ativo:{bg:`${GOLD}18`,tx:GOLD,bd:`${GOLD}30`},inativo:{bg:"rgba(255,68,68,0.1)",tx:RED,bd:"rgba(255,68,68,0.2)"}};
  const s=m[status]||{bg:"rgba(255,255,255,0.07)",tx:MUTED,bd:BDR};
  return <span style={{background:s.bg,color:s.tx,border:`1px solid ${s.bd}`,fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:20,letterSpacing:"0.06em",textTransform:"uppercase",whiteSpace:"nowrap"}}>{status}</span>;
}

function Btn({children,onClick,color,outline,sm}){
  const c=color||GOLD;
  return(
    <button onClick={onClick} style={{background:outline?"transparent":c,border:`1.5px solid ${outline?c+"70":"transparent"}`,borderRadius:100,padding:sm?"8px 22px":"15px 28px",color:outline?c:(c===GOLD?"#0C0C0C":TEXT),fontWeight:600,fontSize:sm?13:14,cursor:"pointer",width:(outline||sm)?"auto":"100%",fontFamily:F,letterSpacing:"0.01em"}}>
      {children}
    </button>

function aggregateChartData(sales,period){
  const now=new Date();
  if(period==="hoje"){
    const hrs=Array.from({length:8},(_,i)=>({label:`${String(6+i*2).padStart(2,'0')}h`,v:0}));
    (sales||[]).forEach(s=>{const h=new Date(s.created_at).getHours();const slot=Math.floor((h-6)/2);if(slot>=0&&slot<8)hrs[slot].v+=Number(s.amount);});
    return hrs;
  }
  if(period==="semana"){
    const days=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"].map(l=>({label:l,v:0}));
    (sales||[]).forEach(s=>{const d=(new Date(s.created_at).getDay()+6)%7;days[d].v+=Number(s.amount);});
    return days;
  }
  if(period==="mes"){
    const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
    const days=Array.from({length:dim},(_,i)=>({label:i+1,v:0}));
    (sales||[]).forEach(s=>{const d=new Date(s.created_at).getDate()-1;if(d>=0&&d<dim)days[d].v+=Number(s.amount);});
    return days;
  }
  if(period==="trimestre"){
    const mLabels=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
    const qStartMonth=Math.floor(now.getMonth()/3)*3;
    const qMonths=[0,1,2].map(i=>({label:mLabels[qStartMonth+i],v:0}));
    (sales||[]).forEach(s=>{const m=new Date(s.created_at).getMonth()-qStartMonth;if(m>=0&&m<3)qMonths[m].v+=Number(s.amount);});
    return qMonths;
  }
  const months=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"].map(l=>({label:l,v:0}));
  (sales||[]).forEach(s=>{const m=new Date(s.created_at).getMonth();months[m].v+=Number(s.amount);});
  return months;
}

function AdvancedChart({accent=GOLD,vis=true,endpoint}){
  const [period,setPeriod]=useState("mes");
  // Se tem endpoint, começa em "carregando" (undefined) para nunca mostrar dados fake
  // Se não tem endpoint (modo demo/fallback), começa em null → usa PERIODS
  const [apiSales,setApiSales]=useState(endpoint?undefined:null);
  useEffect(()=>{
    if(!endpoint){setApiSales(null);return;}
    setApiSales(undefined);
    apiCall(`${endpoint}?period=${period}`).then(d=>{setApiSales(d?.sales||[]);});
  },[period,endpoint]);
  // chartData só usa PERIODS se não tiver endpoint E apiSales for null
  const chartData=apiSales!=null?aggregateChartData(apiSales,period):(endpoint?[]:PERIODS[period].data);
  const total=chartData.reduce((a,d)=>a+d.v,0);
  const pd=PERIODS[period];
  const gid=`g-${period}-${accent.replace("#","")}`;
  return(
    <div style={{background:CARD,border:`1px solid ${BDR}`,borderRadius:20,padding:"16px 14px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{color:MUTED,fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.1em",fontFamily:F}}>{pd.label}</div>
          <div style={{color:accent,fontFamily:SF,fontWeight:600,fontSize:22,letterSpacing:"-0.01em"}}>{vis?fmtBRL(total):"R$ ••••••"}</div>
        </div>
      </div>
      <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:10,marginBottom:8,scrollbarWidth:"none",msOverflowStyle:"none",WebkitOverflowScrolling:"touch"}} className="hide-scroll">
        {Object.keys(PERIODS).map(p=>(
          <button key={p} onClick={()=>setPeriod(p)} style={{padding:"4px 11px",borderRadius:100,border:`1px solid ${p===period?accent+"50":BDR}`,background:p===period?`${accent}15`:"transparent",color:p===period?accent:MUTED,fontSize:10,fontWeight:600,cursor:"pointer",fontFamily:F,whiteSpace:"nowrap",flexShrink:0}}>{p}</button>
        ))}
      </div>
      {apiSales===undefined&&<div style={{height:100,display:"flex",alignItems:"flex-end",gap:3,padding:"4px 0"}}>{[35,50,25,65,40,80,30,55,45,70,35,60,45,30,55].map((h,i)=>(<div key={i} className="sk" style={{flex:1,height:`${h}%`,borderRadius:"3px 3px 0 0"}}/>))}</div>}
      {apiSales!==undefined&&<div style={{height:100}}>
        <ResponsiveContainer width="100%" height="100%">
          <AreaChart data={chartData} margin={{top:4,right:4,left:-32,bottom:0}}>
            <defs>
              <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={accent} stopOpacity={0.18}/>
                <stop offset="100%" stopColor={accent} stopOpacity={0}/>
              </linearGradient>
            </defs>
            <CartesianGrid strokeDasharray="2 4" stroke="rgba(255,255,255,0.03)" vertical={false}/>
            <XAxis dataKey="label" tick={{fill:MUTED,fontSize:9,fontFamily:F}} axisLine={false} tickLine={false} interval="preserveStartEnd"/>
            <YAxis hide/>
            <Tooltip contentStyle={{background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,color:"#fff",fontSize:12,fontFamily:F}} formatter={v=>[fmtBRL(v),"Receita"]} labelStyle={{color:MUTED,fontSize:10}}/>
            <Area type="monotone" dataKey="v" stroke={accent} strokeWidth={2} fill={`url(#${gid})`} dot={false}/>
          </AreaChart>
        </ResponsiveContainer>
      </div>}
    </div>
  );
}

function VisitorChart({analytics,loadingAnalytics}){
  const [siteUrl,setSiteUrl]=React.useState("");
  const [saved,setSaved]=React.useState(null);
  const [online,setOnline]=React.useState(null);
  const [editing,setEditing]=React.useState(false);
  const [saving,setSaving]=React.useState(false);
  React.useEffect(()=>{
    (async()=>{
      try{
        const tok=(await _sb?.auth?.getSession())?.data?.session?.access_token||"";
        const r=await fetch(`${RAILWAY}/api/user/site`,{headers:{Authorization:`Bearer ${tok}`}});
        const d=await r.json();
        if(d.site_url){setSaved(d.site_url);setSiteUrl(d.site_url);checkStatus(d.site_url);}
        else setEditing(true);
      }catch{setEditing(true);}
    })();
  },[]);
  const checkStatus=async(url)=>{
    setOnline(null);
    try{
      const tok=(await _sb?.auth?.getSession())?.data?.session?.access_token||"";
      const r=await fetch(`${RAILWAY}/api/site-status?url=${encodeURIComponent(url)}`,{headers:{Authorization:`Bearer ${tok}`}});
      const d=await r.json();setOnline(d.online);
    }catch{setOnline(false);}
  };
  const save=async()=>{
    if(!siteUrl.trim())return;setSaving(true);
    try{
      const tok=(await _sb?.auth?.getSession())?.data?.session?.access_token||"";
      await fetch(`${RAILWAY}/api/user/site`,{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:`Bearer ${tok}`},body:JSON.stringify({site_url:siteUrl.trim()})});
      setSaved(siteUrl.trim());setEditing(false);checkStatus(siteUrl.trim());
    }catch{}setSaving(false);
  };
  const hasData=analytics&&analytics.total>0;
  const chartData=analytics?.daily||[];
  const DAYS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  const chartRows=chartData.map(d=>({...d,label:DAYS[new Date(d.date+"T12:00:00").getDay()]}));
  return(
    <div style={{background:CARD,border:`1px solid ${BDR}`,borderRadius:20,padding:"20px 18px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{color:TEXT,fontWeight:700,fontSize:14}}>Visitantes do site</div>
        {saved&&!editing&&(
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:online===null?"#888":online?"#22c55e":"#ef4444"}}/>
            <span style={{color:MUTED,fontSize:12}}>{online===null?"verificando…":online?"online":"offline"}</span>
          </div>
        )}
      </div>
      {editing?(
        <div style={{display:"flex",gap:8,marginBottom:12}}>
          <input value={siteUrl} onChange={e=>setSiteUrl(e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()} placeholder="ex: meusite.com.br" style={{flex:1,background:CARD2,border:`1px solid ${BDR}`,borderRadius:10,padding:"8px 12px",color:TEXT,fontSize:13,outline:"none"}}/>
          <button onClick={save} disabled={saving} style={{background:GOLD,color:"#000",border:"none",borderRadius:10,padding:"8px 14px",fontWeight:700,fontSize:13,cursor:"pointer"}}>{saving?"…":"Salvar"}</button>
        </div>
      ):(
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>

function FunilClienteAdmin({ownerId}){
  const [funnel,setFunnel]=useState(null);

  useEffect(()=>{

      )):(()=>{

          {label:"Visitaram o site",value:funnel?.visitors||0,color:GOLD},
          {label:"MiniChat",value:funnel?.chat||0,color:"rgba(212,175,55,0.75)"},
          {label:"Interessados",value:funnel?.leads||0,color:"rgba(212,175,55,0.55)"},
          {label:"Link de pagamento",value:funnel?.checkout||0,color:"rgba(212,175,55,0.4)"},

        return steps.map((step,i)=>{

          return(
            <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:i<4?9:0}}>

              <span style={{color:MUTED,fontSize:11,minWidth:30,textAlign:"right"}}>{i>0?`${pct}%`:""}</span>

        <div style={{display:"flex",gap:8,marginTop:14,paddingTop:14,borderTop:`1px solid ${BDR}`}}>

        </div>
      )}

  );

const QQ=["📊 Vendas hoje?","💰 Receita da semana?","🔗 Gerar link de afiliado","📈 Minha conversão?","❓ Configurar checkout","🆘 Suporte"];
// AR removido — chat IA sempre chama a API real (Anthropic), respostas hardcoded não são usadas

function ChatIA({productName, onBack}){
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState("");
  const [showQ,setShowQ]=useState(true);
  const [sending,setSending]=useState(false);
  const bottom=useRef(null);
  useEffect(()=>{bottom.current?.scrollIntoView({block:"nearest"})},[msgs]);
  const send=async(text)=>{
    const msg=text||input;if(!msg.trim()||sending)return;
    setInput("");setShowQ(false);setSending(true);
    const newMsgs=[...msgs,{role:"user",text:msg}];
    setMsgs(newMsgs);
    try{
      const data=await apiCall('/api/chat',{method:'POST',body:JSON.stringify({
        messages:newMsgs.map(m=>({role:m.role==='ai'?'assistant':m.role,content:m.text})),
        productContext:productName
      })});
      setMsgs(p=>[...p,{role:"ai",text:data.reply||"Em breve — assistente IA em configuração."}]);
    }catch(e){
      setMsgs(p=>[...p,{role:"ai",text:"Em breve — assistente IA em configuração."}]);
    }
    setSending(false);
  };
  return(
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 83px)",minHeight:300}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexShrink:0}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:MUTED,fontSize:13,cursor:"pointer",textAlign:"left",fontWeight:600,fontFamily:F}}>← Voltar para o Início</button>
      </div>
      <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
            <div style={{maxWidth:"76%",padding:"11px 15px",borderRadius:16,fontSize:13,lineHeight:1.55,background:m.role==="user"?`${GOLD}18`:"rgba(255,255,255,0.05)",color:TEXT,border:`1px solid ${m.role==="user"?GOLD+"30":BDR}`}}>{m.text}</div>
          </div>
        ))}
        {showQ&&(
          <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:6}}>
            <div style={{color:MUTED,fontSize:11,marginBottom:2}}>Perguntas rápidas:</div>
            {QQ.map(q=>(
              <button key={q} onClick={()=>send(q)} style={{textAlign:"left",padding:"10px 14px",borderRadius:12,background:CARD,border:`1px solid ${BDR}`,color:"rgba(255,255,255,0.75)",fontSize:13,cursor:"pointer",fontWeight:500,fontFamily:F}}>{q}</button>
            ))}
          </div>
        )}
        {sending&&<div style={{display:"flex",justifyContent:"flex-start"}}><div style={{padding:"11px 16px",borderRadius:16,background:"rgba(255,255,255,0.05)",border:`1px solid ${BDR}`,color:MUTED,fontSize:13}}>✦ digitando…</div></div>}
        <div ref={bottom}/>
      </div>
      <div style={{display:"flex",gap:8,flexShrink:0,paddingBottom:4}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder="Mensagem..." disabled={sending} style={{flex:1,background:CARD,border:`1px solid ${BDR}`,borderRadius:14,padding:"13px 16px",color:TEXT,fontSize:14,outline:"none",fontFamily:F,opacity:sending?0.6:1}}/>
        <button onClick={()=>send()} disabled={sending} style={{width:46,height:46,borderRadius:14,background:sending?"rgba(212,175,55,0.4)":GOLD,border:"none",color:"#0A0A0A",fontSize:18,cursor:sending?"not-allowed":"pointer",fontWeight:900,flexShrink:0}}>→</button>
      </div>
    </div>
  );
}

function InstalacaoAdmin({c,onUpdated}){
  const [open,setOpen]=useState(false);
  const [metodo,setMetodo]=useState(c.github_repo?"github":"gtm");
  const sensorSnippet=`<script src="https://josephpay-production.up.railway.app/sensor.js?uid=${c.id}"><\/script>`;
  // ── Google Tag Manager ──
  const [googleConnected,setGoogleConnected]=useState(null);
  const [accounts,setAccounts]=useState(null);
  const [containers,setContainers]=useState(null);
  const [accountId,setAccountId]=useState(c.gtm_account_id||"");
  const [containerId,setContainerId]=useState(c.gtm_container_id||"");
  const [containerName,setContainerName]=useState(c.gtm_container_name||"");
  const [gtmSaving,setGtmSaving]=useState(false);
  const [gtmInstalling,setGtmInstalling]=useState(false);
  const [gtmInstalledAt,setGtmInstalledAt]=useState(c.gtm_sensor_installed_at||null);
  const [gtmMsg,setGtmMsg]=useState("");
  useEffect(()=>{
    apiCall('/api/admin/google/status').then(d=>{
      setGoogleConnected(!!d?.connected);
      if(d?.connected)apiCall('/api/admin/google/tagmanager/accounts').then(a=>{if(a?.accounts)setAccounts(a.accounts);});
    });
  },[]);
  const onAccountChange=async(val)=>{
    setAccountId(val);setContainerId("");setContainers(null);
    if(!val)return;
    const d=await apiCall(`/api/admin/google/tagmanager/containers?accountId=${val}`);
    if(d?.containers)setContainers(d.containers);
  };
  const salvarVinculoGtm=async()=>{
    if(!accountId||!containerId)return;
    setGtmSaving(true);setGtmMsg("");
    const nome=containers?.find(x=>x.id===containerId)?.name||containerName;
    const d=await apiCall(`/api/admin/producers/${c.id}/gtm`,{method:'POST',body:JSON.stringify({account_id:accountId,container_id:containerId,container_name:nome})});
    setGtmSaving(false);
    if(d.error)setGtmMsg(d.error);
    else{setContainerName(nome);setGtmMsg("Container vinculado.");setTimeout(()=>setGtmMsg(""),2500);onUpdated&&onUpdated();}
  };
  const instalarGtm=async()=>{
    if(!accountId||!containerId)return;
    setGtmInstalling(true);setGtmMsg("");
    // Manda sempre o que está selecionado agora na tela — não depende de ter clicado em "Vincular" antes.
    const d=await apiCall(`/api/admin/producers/${c.id}/gtm/install-sensor`,{method:'POST',body:JSON.stringify({account_id:accountId,container_id:containerId})});
    setGtmInstalling(false);
    if(d.error)setGtmMsg(d.error);
    else{setGtmInstalledAt(new Date().toISOString());setGtmMsg("Sensor instalado e publicado no GTM.");onUpdated&&onUpdated();}
  };
  // ── GitHub ──
  const [githubConnected,setGithubConnected]=useState(null);
  const [repos,setRepos]=useState(null);
  const [repoFullName,setRepoFullName]=useState(c.github_repo||"");
  const [files,setFiles]=useState(null);
  const [filePath,setFilePath]=useState(c.github_file_path||"");
  const [ghSaving,setGhSaving]=useState(false);
  const [ghInstalling,setGhInstalling]=useState(false);
  const [ghInstalledAt,setGhInstalledAt]=useState(c.github_sensor_installed_at||null);
  const [ghMsg,setGhMsg]=useState("");
  const [links,setLinks]=useState(null);
  const [selected,setSelected]=useState({});
  const [applying,setApplying]=useState(false);
  const [msgLinks,setMsgLinks]=useState("");
  const [minichatPath,setMinichatPath]=useState(c.github_minichat_path||"minichat.html");
  const [editingMinichatPath,setEditingMinichatPath]=useState(false);
  const [installingMinichat,setInstallingMinichat]=useState(false);
  const [minichatInstalledAt,setMinichatInstalledAt]=useState(c.github_minichat_installed_at||null);
  const [msgMinichat,setMsgMinichat]=useState("");
  const minichatLink=`https://josephpay.com/minichat.html?uid=${c.id}`;
  const instalarMinichat=async()=>{
    if(!repoFullName||!minichatPath.trim())return;
    setInstallingMinichat(true);setMsgMinichat("");
    const d=await apiCall(`/api/admin/producers/${c.id}/github/install-minichat`,{method:'POST',body:JSON.stringify({file_path:minichatPath.trim()})});
    setInstallingMinichat(false);
    if(d.error){setMsgMinichat(d.error);return;}
    setMinichatInstalledAt(new Date().toISOString());
    setMsgMinichat(`✓ Página criada em ${d.file_path}.`);
    onUpdated&&onUpdated();
  };
  const carregarLinks=()=>{
    if(!c.github_repo||!c.github_file_path)return;
    setLinks(null);setMsgLinks("");setSelected({});
    apiCall(`/api/admin/github/scan-links?repo=${encodeURIComponent(c.github_repo)}&file=${encodeURIComponent(c.github_file_path)}`).then(d=>{
      if(d.error){setMsgLinks(d.error);setLinks([]);return;}
      setLinks(d.links||[]);
    });
  };
  useEffect(()=>{if(open&&metodo==="github"&&c.github_repo&&c.github_file_path)carregarLinks();},[open,metodo,c.github_repo,c.github_file_path]);
  const toggleLink=href=>setSelected(s=>({...s,[href]:!s[href]}));
  const selecionados=Object.keys(selected).filter(h=>selected[h]);
  const aplicarLinks=async()=>{
    if(!selecionados.length)return;
    setApplying(true);setMsgLinks("");
    const d=await apiCall(`/api/admin/producers/${c.id}/github/apply-links`,{method:'POST',body:JSON.stringify({hrefs:selecionados})});
    setApplying(false);
    if(d.error){setMsgLinks(d.error);return;}
    setMsgLinks(`✓ ${d.changed} link(s) atualizado(s) no repositório.`);
    carregarLinks();
  };
  useEffect(()=>{
    apiCall('/api/admin/github/status').then(d=>{
      setGithubConnected(!!d?.connected);
      if(d?.connected)apiCall('/api/admin/github/repos').then(r=>{if(r?.repos)setRepos(r.repos);});
    });
  },[]);
  useEffect(()=>{
    if(!repoFullName){setFiles(null);return;}
    setFiles(null);
    apiCall(`/api/admin/github/repo-files?repo=${encodeURIComponent(repoFullName)}`).then(d=>{
      const list=d?.files||[];
      setFiles(list);
      // pré-seleciona index.html na raiz se existir; senão mantém o que já estava salvo pra esse cliente
      if(list.includes("index.html"))setFilePath("index.html");
      else if(c.github_repo===repoFullName&&c.github_file_path)setFilePath(c.github_file_path);
      else if(list.length===1)setFilePath(list[0]);
      else setFilePath("");
    });
  },[repoFullName]);
  const salvarVinculoGh=async()=>{
    if(!repoFullName||!filePath.trim())return;
    setGhSaving(true);setGhMsg("");
    const d=await apiCall(`/api/admin/producers/${c.id}/github`,{method:'POST',body:JSON.stringify({repo:repoFullName,file_path:filePath.trim()})});
    setGhSaving(false);
    if(d.error){setGhMsg(d.error);}else{setGhMsg("Repositório vinculado.");setTimeout(()=>setGhMsg(""),2500);onUpdated&&onUpdated();}
  };
  const instalarGh=async()=>{
    if(!repoFullName||!filePath.trim())return;
    setGhInstalling(true);setGhMsg("");
    // Manda sempre o que está selecionado agora na tela — não depende de ter clicado em "Vincular" antes.
    const d=await apiCall(`/api/admin/producers/${c.id}/github/install-sensor`,{method:'POST',body:JSON.stringify({repo:repoFullName,file_path:filePath.trim()})});
    setGhInstalling(false);
    if(d.error)setGhMsg(d.error);
    else{setGhInstalledAt(new Date().toISOString());setGhMsg(d.already?"Sensor já estava instalado neste arquivo.":"Sensor commitado no repositório.");onUpdated&&onUpdated();}
  };
  if(googleConnected===null||githubConnected===null)return null;
  const METODOS=[{id:"gtm",label:"Google Tag Manager"},{id:"github",label:"Código próprio (GitHub)"}];
  return(
    <div style={{background:CARD,border:`1px solid ${BDR}`,borderRadius:20,padding:"18px"}}>

      {open&&(<div style={{marginTop:8}}>
        <div style={{color:MUTED,fontSize:10,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:6}}>Status real de conexão</div>
        <StatusBadges status={c.conn}/>
        <div style={{color:MUTED,fontSize:10,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:6}}>Script do sensor</div>
        <div style={{background:"#0d0d0c",borderRadius:10,padding:"12px 14px",position:"relative",marginBottom:16}}>
          <pre style={{color:"#a8d8a8",fontSize:11,fontFamily:"monospace",whiteSpace:"pre-wrap",wordBreak:"break-all",margin:0}}>{sensorSnippet}</pre>
          <button onClick={()=>navigator.clipboard?.writeText(sensorSnippet)} style={{position:"absolute",top:8,right:8,background:GOLD,color:"#000",border:"none",borderRadius:6,padding:"3px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>Copiar</button>
        </div>
        <div style={{color:MUTED,fontSize:11,marginBottom:10,lineHeight:1.4}}>Como o site desse cliente foi feito?</div>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          {METODOS.map(m=>(
            <button key={m.id} onClick={()=>setMetodo(m.id)} style={{flex:1,padding:"11px",borderRadius:14,border:`1px solid ${m.id===metodo?GOLD+"55":BDR}`,background:m.id===metodo?`${GOLD}14`:CARD2,color:m.id===metodo?GOLD:MUTED,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:F}}>{m.label}</button>
          ))}
        </div>

        {metodo==="gtm"&&(
          !googleConnected?(
            <div style={{color:MUTED,fontSize:12,lineHeight:1.5}}>Conecte sua conta Google na aba <b style={{color:TEXT}}>Integrações</b> do menu para instalar o sensor remotamente neste cliente, sem colar código no site dele.</div>
          ):(
            <>
              <div style={{color:MUTED,fontSize:11,marginBottom:10,lineHeight:1.4}}>Escolha qual container GTM é o site deste cliente. Isso instala o mesmo sensor de sempre, só que remotamente.</div>
              <select value={accountId} onChange={e=>onAccountChange(e.target.value)} style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"11px 14px",color:TEXT,fontSize:13,outline:"none",fontFamily:F,marginBottom:8}}>
                <option value="">{accounts===null?"Carregando contas…":"Selecione a conta GTM"}</option>
                {(accounts||[]).map(a=>(<option key={a.id} value={a.id}>{a.name}</option>))}
              </select>
              {accountId&&(
                <select value={containerId} onChange={e=>setContainerId(e.target.value)} style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"11px 14px",color:TEXT,fontSize:13,outline:"none",fontFamily:F,marginBottom:10}}>
                  <option value="">{containers===null?"Carregando containers…":"Selecione o container deste cliente"}</option>
                  {(containers||[]).map(ct=>(<option key={ct.id} value={ct.id}>{ct.name}</option>))}

              )}
              {containerName&&<div style={{color:MUTED,fontSize:11,marginBottom:10}}>Vinculado hoje: <b style={{color:TEXT}}>{containerName}</b></div>}
              <div style={{display:"flex",gap:8,marginBottom:8,flexWrap:"wrap"}}>

          ):(

              {repoFullName&&files&&files.length>0?(
                <SearchSelect
                  value={filePath}
                  onChange={setFilePath}
                  options={files}
                  placeholder="Buscar/selecionar arquivo…"
                />
              ):(
                <input value={filePath} onChange={e=>setFilePath(e.target.value)} placeholder={repoFullName&&files===null?"Carregando arquivos…":repoFullName&&files&&files.length===0?"Nenhum .html encontrado — digite o caminho":"Caminho do arquivo (ex: index.html)"} style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"11px 14px",color:TEXT,fontSize:13,outline:"none",fontFamily:F,marginBottom:10}}/>
              )}

                      Vamos criar o arquivo <b style={{color:TEXT}}>{minichatPath}</b> no repositório do cliente.{" "}
                      <button onClick={()=>setEditingMinichatPath(true)} style={{background:"none",border:"none",color:GOLD,fontSize:12,cursor:"pointer",fontFamily:F,textDecoration:"underline",padding:0}}>usar outro nome</button>

                    <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12,maxHeight:320,overflowY:"auto"}}>

                        const checked=!!selected[l.href];

                          <label key={l.href} style={{display:"flex",alignItems:"flex-start",gap:10,background:CARD2,border:`1px solid ${checked?GOLD+"55":BDR}`,borderRadius:12,padding:"10px 12px",cursor:isMinichat?"default":"pointer",opacity:isMinichat?0.55:1}}>

                            <div style={{flex:1,minWidth:0}}>

                            </div>
                          </label>
                        );
                      })}
                    </div>
                  )}
                  {msgLinks&&<div style={{color:msgLinks.startsWith("✓")?GREEN:RED,fontSize:12,marginBottom:10}}>{msgLinks}</div>}
                  <button onClick={aplicarLinks} disabled={!selecionados.length||applying} style={{width:"100%",background:GOLD,border:"none",borderRadius:100,padding:12,color:"#0C0C0C",fontWeight:700,fontSize:13,cursor:(!selecionados.length||applying)?"default":"pointer",fontFamily:F,opacity:!selecionados.length?0.5:1}}>{applying?"Aplicando…":`Aplicar em ${selecionados.length||""} link(s)`}</button>
                </div>
              )}
            </>
          )
        )}
      </div>)}
    </div>
  );
}

function EmailAdmin({c,onUpdated}){
  const [open,setOpen]=useState(false);
  const [status,setStatus]=useState(null);
  const [host,setHost]=useState("");
  const [port,setPort]=useState("465");
  const [user,setUser]=useState("");
  const [pass,setPass]=useState("");
  const [fromName,setFromName]=useState("");
  const [connecting,setConnecting]=useState(false);
  const [msg,setMsg]=useState("");
  const load=()=>apiCall(`/api/admin/producers/${c.id}/email/status`).then(d=>{if(!d.error)setStatus(d);});
  useEffect(()=>{load();},[c.id]);
  const conectar=async()=>{
    if(!host.trim()||!port||!user.trim()||!pass.trim())return;
    setConnecting(true);setMsg("");
    const d=await apiCall(`/api/admin/producers/${c.id}/email/connect`,{method:'POST',body:JSON.stringify({host:host.trim(),port,user:user.trim(),pass,fromName:fromName.trim()})});
    setConnecting(false);
    if(d.error){setMsg(d.error);return;}
    setPass("");
    setMsg("E-mail conectado.");
    load();
    onUpdated&&onUpdated();
  };
  const desconectar=async()=>{
    if(!window.confirm(`Desconectar o e-mail de ${c.name}? Os disparos por e-mail param de funcionar até reconectar.`))return;
    await apiCall(`/api/admin/producers/${c.id}/email/disconnect`,{method:'POST'});
    load();
    onUpdated&&onUpdated();
  };
  if(status===null)return null;
  return(
    <div style={{background:CARD,border:`1px solid ${BDR}`,borderRadius:20,padding:"18px"}}>
      <CardHeader title="E-mail (disparos)" open={open} onToggle={()=>setOpen(o=>!o)}/>
      {open&&(<>
      <div style={{color:MUTED,fontSize:12,marginBottom:14,lineHeight:1.5}}>Conecte o e-mail deste cliente (Gmail, Outlook etc — com senha de app) pra ele conseguir mandar e-mail em massa pro CRM. Você faz isso pelo cliente, sem ele precisar mexer em nada técnico.</div>
      {status.connected?(
        <div>
          <div style={{display:"flex",alignItems:"center",gap:8,background:`${GREEN}12`,border:`1px solid ${GREEN}30`,borderRadius:12,padding:"10px 14px",marginBottom:12}}>
            <span style={{width:7,height:7,borderRadius:"50%",background:GREEN,flexShrink:0}}/>
            <span style={{color:TEXT,fontSize:12,fontWeight:600}}>Conectado: {status.email}</span>
          </div>
          <Btn sm outline color={RED} onClick={desconectar}>Desconectar</Btn>
        </div>
      ):(
        <>
          <input value={host} onChange={e=>setHost(e.target.value)} placeholder="Servidor SMTP (ex: smtp.gmail.com)" style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"11px 14px",color:TEXT,fontSize:13,outline:"none",fontFamily:F,marginBottom:8}}/>
          <input value={port} onChange={e=>setPort(e.target.value)} placeholder="Porta (465 ou 587)" style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"11px 14px",color:TEXT,fontSize:13,outline:"none",fontFamily:F,marginBottom:8}}/>
          <input value={user} onChange={e=>setUser(e.target.value)} placeholder="E-mail" style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"11px 14px",color:TEXT,fontSize:13,outline:"none",fontFamily:F,marginBottom:8}}/>
          <input value={pass} onChange={e=>setPass(e.target.value)} type="password" placeholder="Senha de app" style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"11px 14px",color:TEXT,fontSize:13,outline:"none",fontFamily:F,marginBottom:8}}/>
          <input value={fromName} onChange={e=>setFromName(e.target.value)} placeholder="Nome de exibição (opcional)" style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"11px 14px",color:TEXT,fontSize:13,outline:"none",fontFamily:F,marginBottom:10}}/>
          <button onClick={conectar} disabled={connecting} style={{width:"100%",background:GOLD,border:"none",borderRadius:100,padding:11,color:"#0C0C0C",fontWeight:700,fontSize:13,cursor:connecting?"default":"pointer",fontFamily:F,opacity:connecting?0.7:1}}>{connecting?"Conectando…":"Conectar e-mail"}</button>
        </>
      )}
      {msg&&<div style={{color:MUTED,fontSize:11,marginTop:8}}>{msg}</div>}
      </>)}
    </div>
  );
}

function NotaProdutorAdmin({ownerId}){
  const [note,setNote]=useState("");
  const [loaded,setLoaded]=useState(false);
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  useEffect(()=>{
    if(!ownerId)return;
    setLoaded(false);
    apiCall(`/api/admin/producers/${ownerId}/notes`).then(d=>{setNote(d?.note||"");setLoaded(true);});
  },[ownerId]);
  const salvar=async()=>{
    setSaving(true);
    const d=await apiCall(`/api/admin/producers/${ownerId}/notes`,{method:'PATCH',body:JSON.stringify({note})});
    setSaving(false);
    if(!d?.error){setSaved(true);setTimeout(()=>setSaved(false),2000);}

  return(
    <div style={{background:CARD,border:`1px solid ${BDR}`,borderRadius:20,padding:"18px"}}>

      <button onClick={salvar} disabled={saving} style={{width:"100%",background:saved?`${GREEN}18`:GOLD,border:saved?`1px solid ${GREEN}40`:"none",borderRadius:100,padding:11,color:saved?GREEN:"#0C0C0C",fontWeight:700,fontSize:13,cursor:saving?"default":"pointer",fontFamily:F}}>{saving?"Salvando…":saved?"✓ Salvo":"Salvar nota"}</button>

  );

function AdicionarContatosModal({ownerId,nome,onClose,onCreated}){
  const [text,setText]=useState("");
  const [statuses,setStatuses]=useState({});
  const [saving,setSaving]=useState(false);
  const [error,setError]=useState("");
  const [savedCount,setSavedCount]=useState(null);
  const parseLine=(line)=>{
    line=line.trim();
    if(!line)return null;
    const parts=line.split(/\t|,|;| - /).map(p=>p.trim()).filter(Boolean);
    let name="",phone="",email="";
    parts.forEach(p=>{
      if(/@/.test(p))email=p;
      else if(/^[\d\s()+.-]{8,}$/.test(p))phone=p.replace(/[^\d+]/g,"");
      else if(!name)name=p;
    });
    if(!name)return null;
    return{name,phone,email};
  };
  const parsed=text.split("\n").map(parseLine).filter(Boolean);
  const salvar=async()=>{
    if(!parsed.length)return;
    setSaving(true);setError("");
    const contacts=parsed.map((c,i)=>({...c,status:statuses[i]||"lead"}));
    const d=await apiCall(`/api/admin/producers/${ownerId}/customers/bulk`,{method:'POST',body:JSON.stringify({contacts})});
    setSaving(false);
    if(d.error){setError(d.error);return;}
    setSavedCount(d.count);
    onCreated&&onCreated();
  };
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",backdropFilter:"blur(6px)",WebkitBackdropFilter:"blur(6px)",zIndex:200,display:"flex",alignItems:"flex-end"}}>
      <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:480,margin:"0 auto",background:CARD,borderRadius:"24px 24px 0 0",padding:"12px 24px 40px",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{width:32,height:4,borderRadius:2,background:"rgba(255,255,255,0.15)",margin:"0 auto 20px"}}/>
        {savedCount!==null?(
          <div style={{textAlign:"center",padding:"20px 0 10px"}}>
            <div style={{color:GREEN,fontSize:40,marginBottom:12}}>✓</div>
            <div style={{color:TEXT,fontWeight:800,fontSize:18,marginBottom:8}}>{savedCount} contato(s) adicionado(s)!</div>
            <div style={{color:MUTED,fontSize:13,marginBottom:20}}>Já aparecem no CRM de {nome}, direto no painel dele.</div>
            <button onClick={onClose} style={{width:"100%",background:GOLD,border:"none",borderRadius:100,padding:14,color:"#0C0C0C",fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:F}}>Fechar</button>
          </div>
        ):(
          <>
            <div style={{color:TEXT,fontWeight:800,fontSize:18,marginBottom:6}}>Adicionar contatos</div>
            <div style={{color:MUTED,fontSize:12,marginBottom:16,lineHeight:1.5}}>Cole a lista — um contato por linha. O sistema separa nome, telefone e e-mail sozinho. Depois só marca quem é interessado ou já é cliente.</div>
            <textarea value={text} onChange={e=>setText(e.target.value)} placeholder={"João Silva, 21999998888, joao@email.com\nMaria Souza, 21988887777"} rows={5} style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"13px 14px",color:TEXT,fontSize:13,outline:"none",fontFamily:F,marginBottom:14,resize:"vertical"}}/>
            {parsed.length>0&&(
              <div style={{marginBottom:14}}>
                <div style={{color:MUTED,fontSize:10,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:8}}>{parsed.length} contato(s) encontrado(s)</div>
                <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:260,overflowY:"auto"}}>
                  {parsed.map((c,i)=>{
                    const status=statuses[i]||"lead";
                    return(
                      <div key={i} style={{background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"10px 12px",display:"flex",alignItems:"center",gap:10}}>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{color:TEXT,fontWeight:600,fontSize:13}}>{c.name}</div>
                          <div style={{color:MUTED,fontSize:11,marginTop:1}}>{[c.phone,c.email].filter(Boolean).join(" · ")||"sem contato"}</div>
                        </div>
                        <div style={{display:"flex",gap:4,flexShrink:0}}>
                          {[["lead","Interessado"],["cliente","Cliente"]].map(([val,label])=>(
                            <button key={val} onClick={()=>setStatuses(s=>({...s,[i]:val}))} style={{padding:"5px 10px",borderRadius:20,border:`1px solid ${status===val?GOLD+"55":BDR}`,background:status===val?`${GOLD}18`:"transparent",color:status===val?GOLD:MUTED,fontSize:10,fontWeight:700,cursor:"pointer",fontFamily:F,whiteSpace:"nowrap"}}>{label}</button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
            {error&&<div style={{color:RED,fontSize:12,marginBottom:12}}>{error}</div>}
            <button onClick={salvar} disabled={!parsed.length||saving} style={{width:"100%",background:GOLD,border:"none",borderRadius:100,padding:14,color:"#0C0C0C",fontWeight:700,fontSize:14,cursor:(!parsed.length||saving)?"default":"pointer",fontFamily:F,opacity:!parsed.length?0.5:1}}>{saving?"Salvando…":`Salvar ${parsed.length||""} contato(s)`}</button>
          </>
        )}
      </div>
    </div>
  );
}

const DEFAULT_MINICHAT_QUESTIONS=[
  {text:"Olá. Vamos fazer um diagnóstico rápido da sua presença digital.\n\nLeva menos de 1 minuto.",subtext:"Qual seu principal objetivo hoje?",options:["Conseguir mais clientes","Passar mais credibilidade","Ter um link profissional","Receber agendamentos"]},
  {text:"Perfeito.",subtext:"Qual sua situação atual?",options:["Não tenho site","Só tenho Instagram","Site antigo/desatualizado","Site não converte"]},
  {text:"Entendido.",subtext:"Qual sua maior dificuldade hoje?",options:["Perguntam preço e somem","Explico tudo no WhatsApp","Não pareço profissional","Não tenho autoridade digital"]},
  {text:"Última pergunta.",subtext:"Se tivesse um site hoje, prioridade máxima seria?",options:["Mostrar serviços claros","Receber mais contatos","Ter link profissional","Sistema de agendamento"]},
];
function AtivacaoAdmin({c}){
  const [wapNum,setWapNum]=useState(c.minichat_config?.whatsapp_number||"");
  const [brandName,setBrandName]=useState(c.minichat_config?.brand_name||c.name||"");
  const [avatarUrl,setAvatarUrl]=useState(c.minichat_config?.avatar_url||"");
  const [uploadingFoto,setUploadingFoto]=useState(false);
  const [redirectLink,setRedirectLink]=useState(c.minichat_config?.redirect_link||"");
  const [emailDestino,setEmailDestino]=useState(c.minichat_config?.email_destino||"");
  const [objetivoOptions,setObjetivoOptions]=useState((c.minichat_config?.objetivo_options||[]).join("\n"));
  const [miniSaved,setMiniSaved]=useState(false);
  const [resetResult,setResetResult]=useState(null);
  const [resetting,setResetting]=useState(false);
  const [maisOpcoes,setMaisOpcoes]=useState(false);
  const enviarFoto=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    e.target.value="";
    setUploadingFoto(true);
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      const d=await apiCall(`/api/admin/producers/${c.id}/minichat/avatar`,{method:'POST',body:JSON.stringify({base64:ev.target.result})});
      setUploadingFoto(false);
      if(d?.url)setAvatarUrl(d.url);
    };
    reader.readAsDataURL(file);
  };
  const salvarMinichat=async()=>{
    if(!wapNum.trim())return;
    const d=await apiCall(`/api/admin/producers/${c.id}/minichat`,{method:'PATCH',body:JSON.stringify({
      whatsapp_number:wapNum.trim(),
      brand_name:brandName.trim(),
      greeting_name:brandName.trim(),
      avatar_url:avatarUrl.trim(),
      redirect_link:redirectLink.trim(),
      email_destino:emailDestino.trim(),
      objetivo_options:objetivoOptions.split("\n").map(s=>s.trim()).filter(Boolean),
    })});
    if(!d.error){setMiniSaved(true);setTimeout(()=>setMiniSaved(false),2000);}
  };
  const resetarSenha=async()=>{
    if(!window.confirm(`Gerar uma nova senha para ${c.name}? A senha antiga deixa de funcionar.`))return;
    setResetting(true);
    const d=await apiCall(`/api/admin/producers/${c.id}/reset-password`,{method:'POST'});
    setResetting(false);
    if(!d.error)setResetResult(d.password);
  };
  const [open,setOpen]=useState(false);
  return(
    <div style={{background:CARD,border:`1px solid ${BDR}`,borderRadius:20,padding:"18px"}}>
      <CardHeader title="Mini Chat" open={open} onToggle={()=>setOpen(o=>!o)}/>
      {open&&(<div style={{marginTop:8}}>
      <input value={wapNum} onChange={e=>setWapNum(e.target.value)} placeholder="Número de WhatsApp (5524999999999)" style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"11px 14px",color:TEXT,fontSize:13,outline:"none",fontFamily:F,marginBottom:8}}/>
      <input value={brandName} onChange={e=>setBrandName(e.target.value)} placeholder="Nome usado na saudação" style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"11px 14px",color:TEXT,fontSize:13,outline:"none",fontFamily:F,marginBottom:10}}/>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <Avatar url={avatarUrl} name={brandName||"M"} size={44} radius={12} fontSize={16}/>
        <label style={{flex:1,background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"11px 14px",color:MUTED,fontSize:12,cursor:"pointer",fontFamily:F,textAlign:"center"}}>
          {uploadingFoto?"Enviando…":avatarUrl?"Trocar foto":"Foto do Mini Chat"}
          <input type="file" accept="image/*" onChange={enviarFoto} disabled={uploadingFoto} style={{display:"none"}}/>
        </label>
      </div>

      <button onClick={()=>setMaisOpcoes(m=>!m)} style={{background:"none",border:"none",color:GOLD,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:F,padding:0,marginBottom:maisOpcoes?14:16,display:"flex",alignItems:"center",gap:4}}>Mais opções {maisOpcoes?"▲":"▼"}</button>

      {maisOpcoes&&(<>
      <div style={{color:MUTED,fontSize:11,marginBottom:14,lineHeight:1.4}}>Essa foto é só do widget do Mini Chat. Pra trocar a foto do perfil do cliente (a que aparece no card da lista e no topo do perfil), clique em cima do avatar lá.</div>
      <div style={{color:MUTED,fontSize:10,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:6}}>Opções da pergunta "objetivo" (fluxo padrão)</div>
      <textarea value={objetivoOptions} onChange={e=>setObjetivoOptions(e.target.value)} placeholder={"Uma opção por linha (opcional)\nEx:\nAliviar dor\nMelhorar estética\nPrevenção"} rows={3} style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"11px 14px",color:TEXT,fontSize:13,outline:"none",fontFamily:F,marginBottom:4,resize:"vertical"}}/>
      <div style={{color:MUTED,fontSize:11,marginBottom:14,lineHeight:1.4}}>Se deixar em branco, a pergunta "qual seu objetivo?" vira campo de texto livre no Mini Chat. Só vale pro fluxo padrão (quando o cliente não tem perguntas personalizadas configuradas abaixo).</div>

      <div style={{color:MUTED,fontSize:10,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:6}}>Redirecionamento final</div>
      <input value={redirectLink} onChange={e=>setRedirectLink(e.target.value)} placeholder="Link de redirecionamento (opcional — sobrepõe WhatsApp e E-mail)" style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"11px 14px",color:TEXT,fontSize:13,outline:"none",fontFamily:F,marginBottom:8}}/>
      <input value={emailDestino} onChange={e=>setEmailDestino(e.target.value)} placeholder="E-mail da empresa (opcional)" style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:12,padding:"11px 14px",color:TEXT,fontSize:13,outline:"none",fontFamily:F,marginBottom:4}}/>
      <div style={{color:MUTED,fontSize:11,marginBottom:14,lineHeight:1.4}}>Se preencher o link de redirecionamento, ele sobrepõe tudo (o botão final abre só esse link). Senão, com o e-mail preenchido, o visitante escolhe no final entre abrir o WhatsApp ou o e-mail (já preenchidos) pra mandar o diagnóstico.</div>

      {(miniSaved||c.minichat_config)&&<div style={{marginBottom:14}}><CopyField label="Link do Mini Chat" value={`https://josephpay.com/minichat.html?uid=${c.id}`}/></div>}
      <div style={{color:MUTED,fontSize:10,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:6}}>Senha de acesso</div>
      {resetResult?<CopyField label="Nova senha" value={resetResult}/>:
        <Btn sm outline color={RED} onClick={resetarSenha}>{resetting?"Gerando…":"Resetar senha"}</Btn>}
      <div style={{height:14}}/>
      </>)}

      <button onClick={salvarMinichat} style={{width:"100%",background:miniSaved?`${GREEN}18`:GOLD,border:miniSaved?`1px solid ${GREEN}40`:"none",borderRadius:100,padding:11,color:miniSaved?GREEN:"#0C0C0C",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:F}}>{miniSaved?"✓ Salvo":"Salvar Mini Chat"}</button>
      </div>)}
    </div>
  );
}

function PerguntasMinichatAdmin({c}){
  const [open,setOpen]=useState(false);
  const [questions,setQuestions]=useState(c.minichat_config?.questions?.length?c.minichat_config.questions:DEFAULT_MINICHAT_QUESTIONS.map(q=>({...q,options:[...q.options]})));
  const [usandoPadrao]=useState(!c.minichat_config?.questions?.length);
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  const [msg,setMsg]=useState("");
  const [regenerating,setRegenerating]=useState({});
  const addQuestion=()=>setQuestions(qs=>[...qs,{text:"",subtext:"",options:["","","",""]}]);
  const removeQuestion=i=>setQuestions(qs=>qs.filter((_,idx)=>idx!==i));
  const updateQuestion=(i,field,val)=>setQuestions(qs=>qs.map((q,idx)=>idx===i?{...q,[field]:val}:q));
  const updateOption=(qi,oi,val)=>setQuestions(qs=>qs.map((q,idx)=>idx===qi?{...q,options:q.options.map((o,oidx)=>oidx===oi?val:o)}:q));
  const addOption=qi=>setQuestions(qs=>qs.map((q,idx)=>idx===qi?{...q,options:[...q.options,""]}:q));
  const removeOption=(qi,oi)=>setQuestions(qs=>qs.map((q,idx)=>idx===qi?{...q,options:q.options.filter((_,oidx)=>oidx!==oi)}:q));
  const regenerarPergunta=async(qi)=>{
    setMsg("");
    setRegenerating(r=>({...r,[qi]:true}));
    const d=await apiCall(`/api/admin/producers/${c.id}/minichat/generate-question`,{method:'POST',body:JSON.stringify({index:qi,questions})});
    setRegenerating(r=>({...r,[qi]:false}));
    if(d?.question)setQuestions(qs=>qs.map((q,idx)=>idx===qi?{...q,...d.question}:q));
    else if(d?.error)setMsg(d.error);
  };
  const salvar=async()=>{
    setSaving(true);setMsg("");
    const d=await apiCall(`/api/admin/producers/${c.id}/minichat`,{method:'PATCH',body:JSON.stringify({questions})});
    setSaving(false);
    if(d.error){setMsg(d.error);return;}
    setSaved(true);setTimeout(()=>setSaved(false),2000);
  };
  return(
    <div style={{background:CARD,border:`1px solid ${BDR}`,borderRadius:20,padding:"18px"}}>
      <CardHeader title="Perguntas do Mini Chat" open={open} onToggle={()=>setOpen(o=>!o)}/>
      {open&&(<div style={{marginTop:8}}>
        <div style={{color:MUTED,fontSize:11,marginBottom:14,lineHeight:1.4}}>{usandoPadrao?"Estas são as 4 perguntas padrão do Mini Chat. Edite à vontade — ao salvar, passam a valer só para este cliente.":"Perguntas personalizadas deste cliente."}</div>
        {questions.map((q,qi)=>(
          <div key={qi} style={{background:CARD2,border:`1px solid ${BDR}`,borderRadius:14,padding:"12px",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <span style={{color:MUTED,fontSize:11,fontWeight:700}}>Pergunta {qi+1}</span>
              <div style={{display:"flex",alignItems:"center",gap:14}}>
                <button onClick={()=>regenerarPergunta(qi)} disabled={regenerating[qi]} title="Gerar com IA, com base nos dados deste cliente" style={{background:"none",border:"none",color:regenerating[qi]?MUTED:GOLD,fontSize:13,fontWeight:700,cursor:regenerating[qi]?"default":"pointer",fontFamily:F,padding:0,lineHeight:1}}>{regenerating[qi]?"…":"↻"}</button>
                <button onClick={()=>removeQuestion(qi)} style={{background:"none",border:"none",color:RED,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:F}}>Remover</button>
              </div>
            </div>
            <textarea value={q.text} onChange={e=>updateQuestion(qi,"text",e.target.value)} placeholder="Texto da mensagem (ex: Vamos fazer um diagnóstico rápido)" rows={2} style={{width:"100%",background:"#0d0d0c",border:`1px solid ${BDR}`,borderRadius:10,padding:"9px 11px",color:TEXT,fontSize:12,outline:"none",fontFamily:F,marginBottom:8,resize:"vertical"}}/>
            <input value={q.subtext} onChange={e=>updateQuestion(qi,"subtext",e.target.value)} placeholder="Pergunta objetiva (ex: Qual seu principal objetivo hoje?)" style={{width:"100%",background:"#0d0d0c",border:`1px solid ${BDR}`,borderRadius:10,padding:"9px 11px",color:TEXT,fontSize:12,outline:"none",fontFamily:F,marginBottom:8}}/>
            {q.options.map((opt,oi)=>(
              <div key={oi} style={{display:"flex",gap:6,marginBottom:6}}>
                <input value={opt} onChange={e=>updateOption(qi,oi,e.target.value)} placeholder={`Opção ${oi+1}`} style={{flex:1,background:"#0d0d0c",border:`1px solid ${BDR}`,borderRadius:10,padding:"8px 11px",color:TEXT,fontSize:12,outline:"none",fontFamily:F}}/>
                {q.options.length>2&&<button onClick={()=>removeOption(qi,oi)} style={{background:"none",border:"none",color:MUTED,fontSize:14,cursor:"pointer",padding:"0 6px"}}>✕</button>}
              </div>
            ))}
            <button onClick={()=>addOption(qi)} style={{background:"none",border:`1px dashed ${BDR}`,borderRadius:8,padding:"5px 10px",color:MUTED,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:F,marginTop:2}}>+ Opção</button>
          </div>
        ))}
        <button onClick={addQuestion} style={{width:"100%",background:"none",border:`1px dashed ${BDR}`,borderRadius:12,padding:10,color:MUTED,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:F,marginBottom:16}}>+ Adicionar pergunta</button>
        {msg&&<div style={{color:RED,fontSize:12,marginBottom:10}}>{msg}</div>}
        <button onClick={salvar} disabled={saving} style={{width:"100%",background:saved?`${GREEN}18`:GOLD,border:saved?`1px solid ${GREEN}40`:"none",borderRadius:100,padding:11,color:saved?GREEN:"#0C0C0C",fontWeight:700,fontSize:13,cursor:saving?"default":"pointer",fontFamily:F}}>{saving?"Salvando…":saved?"✓ Salvo":"Salvar perguntas"}</button>
      </div>)}
    </div>
  );
}

function ClientePerfilAdmin({c,onBack,onUpdated}){
  const accent=GOLD;
  const [sales,setSales]=useState(null);
  const [kpis,setKpis]=useState(null);
  const [editing,setEditing]=useState(false);
  const [editName,setEditName]=useState("");
  const [editCompany,setEditCompany]=useState("");
  const [editEmail,setEditEmail]=useState("");
  const [saving,setSaving]=useState(false);
  const [saveErr,setSaveErr]=useState("");
  const [subTab,setSubTab]=useState("geral");
  const [showContatos,setShowContatos]=useState(false);
  const [avatarPreview,setAvatarPreview]=useState("");
  const [uploadingAvatar,setUploadingAvatar]=useState(false);
  useEffect(()=>{
    if(!c)return;
    apiCall(`/api/admin/sales?owner=${c.id}&limit=5`).then(d=>{if(d?.sales)setSales(d.sales);else setSales([]);});
    apiCall(`/api/admin/kpis`).then(d=>{if(d&&!d.error)setKpis(d);});
  },[c?.id]);
  useEffect(()=>{setAvatarPreview("");},[c?.id]);
  const enviarFotoPerfil=async(e)=>{
    const file=e.target.files[0];if(!file||!c)return;
    e.target.value="";
    setUploadingAvatar(true);
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      const d=await apiCall(`/api/admin/producers/${c.id}/avatar`,{method:'POST',body:JSON.stringify({base64:ev.target.result})});
      setUploadingAvatar(false);
      if(d?.url){setAvatarPreview(d.url);onUpdated&&onUpdated();}
    };
    reader.readAsDataURL(file);
  };
  useEffect(()=>{
    if(c){setEditName(c.name||"");setEditCompany(c.company_name||"");setEditEmail(c.email||"");}
  },[c?.id]);
  const cancelarEdicao=()=>{
    setEditing(false);setSaveErr("");
    setEditName(c?.name||"");setEditCompany(c?.company_name||"");setEditEmail(c?.email||"");
  };
  const salvarPerfil=async()=>{
    setSaving(true);setSaveErr("");
    const d=await apiCall(`/api/admin/producers/${c.id}/profile`,{method:'PATCH',body:JSON.stringify({name:editName.trim(),company_name:editCompany.trim(),email:editEmail.trim()})});
    setSaving(false);
    if(d.error){setSaveErr(d.error);return;}
    setEditing(false);
    onUpdated&&onUpdated();
  };
  if(!c) return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <button onClick={onBack} style={{background:"none",border:"none",color:MUTED,fontSize:13,cursor:"pointer",textAlign:"left",fontWeight:600,fontFamily:F}}>← Voltar para clientes</button>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <div style={{background:CARD,border:`1px solid ${BDR}`,borderRadius:20,padding:"18px"}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14}}>
            <div className="sk" style={{width:44,height:44,borderRadius:14,flexShrink:0}}/>
            <div style={{flex:1}}><div className="sk" style={{height:14,width:"45%",borderRadius:6,marginBottom:7}}/><div className="sk" style={{height:10,width:"60%",borderRadius:5}}/></div>
          </div>
          {[1,2,3,4].map(i=>(<div key={i} style={{display:"flex",gap:8,marginBottom:8}}><div className="sk" style={{height:46,flex:1,borderRadius:12}}/><div className="sk" style={{height:46,flex:1,borderRadius:12}}/></div>))}
        </div>
      </div>
    </div>
  );
  const nome=c.name||"—";
  const volFmt=fmtBRL(c.vol||0);
  const taxaFmt=fmtBRL(c.taxa||0);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <button onClick={onBack} style={{background:"none",border:"none",color:MUTED,fontSize:13,cursor:"pointer",textAlign:"left",fontWeight:600,fontFamily:F}}>← Voltar para clientes</button>
      <div style={{background:CARD,border:`1px solid ${BDR}`,borderRadius:20,padding:"20px 18px"}}>
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:14}}>
          <label style={{position:"relative",cursor:uploadingAvatar?"default":"pointer",flexShrink:0}}>
            <Avatar url={avatarPreview||c.avatar_url} name={nome} size={50} radius={16} fontSize={22}/>
            <div style={{position:"absolute",bottom:-2,right:-2,width:20,height:20,borderRadius:"50%",background:GOLD,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,border:`2px solid ${CARD}`}}>{uploadingAvatar?"…":"✎"}</div>
            <input type="file" accept="image/*" onChange={enviarFotoPerfil} disabled={uploadingAvatar} style={{display:"none"}}/>
          </label>
          <div style={{flex:1,minWidth:0}}>
            {!editing?(
              <>
                <div style={{color:TEXT,fontWeight:800,fontSize:17}}>{nome}</div>
                {c.company_name&&<div style={{color:MUTED,fontSize:12,marginTop:2}}>{c.company_name}</div>}
                <div style={{color:MUTED,fontSize:12,marginTop:3}}>📧 {c.email||"—"}</div>
                <div style={{color:MUTED,fontSize:12,marginTop:2}}>{c.produtos||0} produto(s)</div>
              </>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                <input value={editName} onChange={e=>setEditName(e.target.value)} placeholder="Nome" style={{background:CARD2,border:`1px solid ${BDR}`,borderRadius:10,padding:"8px 12px",color:TEXT,fontSize:13,outline:"none",fontFamily:F}}/>
                <input value={editCompany} onChange={e=>setEditCompany(e.target.value)} placeholder="Nome da empresa" style={{background:CARD2,border:`1px solid ${BDR}`,borderRadius:10,padding:"8px 12px",color:TEXT,fontSize:13,outline:"none",fontFamily:F}}/>
                <input value={editEmail} onChange={e=>setEditEmail(e.target.value)} placeholder="E-mail de login" style={{background:CARD2,border:`1px solid ${BDR}`,borderRadius:10,padding:"8px 12px",color:TEXT,fontSize:13,outline:"none",fontFamily:F}}/>
              </div>
            )}
          </div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:8}}>
            <Tag status="ativo"/>
            {!editing&&<button onClick={()=>setEditing(true)} style={{background:"none",border:`1px solid ${BDR}`,borderRadius:20,padding:"5px 12px",color:MUTED,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:F,whiteSpace:"nowrap"}}>✎ Editar</button>}
          </div>
        </div>
        {editing&&(
          <div style={{display:"flex",gap:8,marginBottom:14}}>
            <button onClick={salvarPerfil} disabled={saving} style={{flex:1,background:GOLD,border:"none",borderRadius:100,padding:10,color:"#0C0C0C",fontWeight:700,fontSize:13,cursor:saving?"default":"pointer",fontFamily:F,opacity:saving?0.7:1}}>{saving?"Salvando…":"Salvar"}</button>
            <button onClick={cancelarEdicao} style={{background:"transparent",border:`1px solid ${BDR}`,borderRadius:100,padding:10,color:MUTED,fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:F}}>Cancelar</button>
          </div>
        )}
        {saveErr&&<div style={{color:RED,fontSize:11,marginBottom:10}}>{saveErr}</div>}
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <span style={{background:`${GOLD}14`,color:GOLD,border:`1px solid ${GOLD}28`,fontSize:11,fontWeight:700,padding:"4px 12px",borderRadius:20}}>Volume: {volFmt}</span>
          <span style={{background:`${GOLD}14`,color:GOLD,border:`1px solid ${GOLD}28`,fontSize:11,fontWeight:700,padding:"4px 12px",borderRadius:20}}>Taxas: {taxaFmt}</span>
        </div>
      </div>
      {showContatos&&<AdicionarContatosModal ownerId={c.id} nome={nome} onClose={()=>setShowContatos(false)} onCreated={onUpdated}/>}
      <Btn sm outline color={GOLD} onClick={()=>setShowContatos(true)}>+ Adicionar contatos</Btn>
      <div style={{display:"flex",gap:6}}>
        {[{id:"geral",label:"Visão geral"},{id:"ativacao",label:"⚡ Ativação"}].map(t=>(
          <button key={t.id} onClick={()=>setSubTab(t.id)} style={{flex:1,padding:"11px",borderRadius:14,border:`1px solid ${t.id===subTab?GOLD+"55":BDR}`,background:t.id===subTab?`${GOLD}14`:CARD,color:t.id===subTab?GOLD:MUTED,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:F}}>{t.label}</button>
        ))}
      </div>
      {subTab==="geral"&&(
        <>
          <div className="two-col">
            <KPICard label="Volume total" value={volFmt} accent={accent} icon="◈"/>
            <KPICard label="Taxas geradas" value={taxaFmt} accent={GOLD} icon="◈"/>
            <KPICard label="Produtos" value={String(c.produtos||0)} accent={GOLD} icon="◈"/>
            <KPICard label="Membro desde" value={c.created_at?new Date(c.created_at).toLocaleDateString('pt-BR'):"—"} accent={GOLD} icon="◎"/>
            <KPICard label="Último acesso" value={fmtLastLogin(c.last_login_at)} accent={GOLD} icon="🕒"/>
            <KPICard label="Dias ativos no mês" value={String(c.logins_mes||0)} accent={GOLD} icon="↑"/>
            <KPICard label="Mensalidades pagas" value={fmtBRL(c.mensalidade_total)} sub="acumulado" accent={GOLD} icon="↺"/>
            <KPICard label="Ativação paga" value={fmtBRL(c.ativacao_total)} sub="acumulado" accent={GOLD} icon="◉"/>

function DashClient({accent=GOLD,isDeise,onNav}){
  const [vis,setVis]=useState(()=>localStorage.getItem('jp_vis')==='true');
  const [kpis,setKpis]=useState(null);
  const [lastSales,setLastSales]=useState(null);
  const [totalClientes,setTotalClientes]=useState(null);
  const [syncing,setSyncing]=useState(false);
  const [syncResult,setSyncResult]=useState(null);
  const [msgsHoje,setMsgsHoje]=useState(null);
  const refreshData=()=>{
    apiCall('/api/dashboard/kpis').then(d=>{
      if(d&&!d.error)setKpis(d);
      else setKpis({vendasHoje:0,assinaturasAtivas:0,receitaMes:0,receitaLiquidaMes:0});
    });
    if(_sb){
      _sb.from('sales').select('amount,producer_amount,status,created_at,customer_id,customers(name)').order('created_at',{ascending:false}).limit(3).then(({data,error})=>{setLastSales(data||[]);});
      _sb.from('customers').select('id',{count:'exact',head:true}).is('deleted_at',null).then(({count})=>{setTotalClientes(count||0);});
      _sb.auth.getSession().then(({data:sd})=>{
        if(sd?.session){
          const t=new Date();t.setHours(0,0,0,0);
          _sb.from('messages').select('id',{count:'exact',head:true}).eq('owner_id',sd.session.user.id).neq('status','inbound').gte('created_at',t.toISOString()).then(({count})=>{setMsgsHoje(count||0);});
        } else { setMsgsHoje(0); }
      });
    } else {
      setKpis(v=>v||{vendasHoje:0,assinaturasAtivas:0,receitaMes:0,receitaLiquidaMes:0});
      setLastSales(v=>v||[]);
      setTotalClientes(v=>v||0);
      setMsgsHoje(v=>v||0);
    }
  };
  const syncHistory=async()=>{
    setSyncing(true);setSyncResult(null);
    const r=await apiCall('/api/sync/history',{method:'POST'});
    setSyncing(false);
    if(r&&!r.error){
      setSyncResult(`✓ ${r.inserted} vendas sincronizadas`);
      refreshData(); // recarrega KPIs e lista
      setTimeout(()=>setSyncResult(null),5000);
    } else {
      setSyncResult("Erro ao sincronizar. Tente novamente.");
      setTimeout(()=>setSyncResult(null),4000);
    }
  };
  useEffect(()=>{refreshData();},[]);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div className="jp-gold-card" style={{padding:"20px 24px 20px",minHeight:0}}>
        <div style={{display:"none"}}/>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
          <div style={{color:"rgba(12,12,12,0.55)",fontSize:10,fontWeight:700,letterSpacing:"0.13em",textTransform:"uppercase",fontFamily:F}}>Receita do mês</div>

function CropModal({src,onConfirm,onCancel}){
  const SIZE=240;
  const [zoom,setZoom]=useState(1);
  const [pos,setPos]=useState({x:0,y:0});
  const [drag,setDrag]=useState(null);
  const imgRef=useRef();
  const onDown=e=>{const c=e.touches?e.touches[0]:e;setDrag({sx:c.clientX-pos.x,sy:c.clientY-pos.y});};
  const onMove=e=>{if(!drag)return;const c=e.touches?e.touches[0]:e;setPos({x:c.clientX-drag.sx,y:c.clientY-drag.sy});};
  const onUp=()=>setDrag(null);
  const confirm=()=>{
    const OUT=400;const canvas=document.createElement('canvas');canvas.width=OUT;canvas.height=OUT;
    const ctx=canvas.getContext('2d');const img=imgRef.current;
    ctx.beginPath();ctx.arc(OUT/2,OUT/2,OUT/2,0,Math.PI*2);ctx.clip();
    const nw=img.naturalWidth,nh=img.naturalHeight;
    const cs=SIZE/Math.min(nw,nh);
    const ts=cs*zoom*(OUT/SIZE);
    const dw=nw*ts,dh=nh*ts;
    const cx=OUT/2+pos.x*(OUT/SIZE),cy=OUT/2+pos.y*(OUT/SIZE);
    ctx.drawImage(img,cx-dw/2,cy-dh/2,dw,dh);
    canvas.toBlob(b=>onConfirm(b),'image/jpeg',0.92);
  };
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.92)',zIndex:300,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:24,touchAction:'none'}}>
      <div style={{color:TEXT,fontWeight:700,fontSize:16,marginBottom:20}}>Ajustar foto</div>
      <div style={{width:SIZE,height:SIZE,borderRadius:'50%',overflow:'hidden',border:`3px solid ${GOLD}`,cursor:'grab',position:'relative',background:'#111',userSelect:'none',touchAction:'none'}}
        onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
        onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}>
        <img ref={imgRef} src={src} draggable={false}
          style={{position:'absolute',left:'50%',top:'50%',transform:`translate(calc(-50% + ${pos.x}px),calc(-50% + ${pos.y}px)) scale(${zoom})`,width:SIZE,height:SIZE,objectFit:'cover',transformOrigin:'center',pointerEvents:'none'}}/>
      </div>
      <div style={{marginTop:20,width:'100%',maxWidth:260}}>
        <div style={{color:MUTED,fontSize:11,marginBottom:6,textAlign:'center'}}>Zoom</div>
        <input type="range" min="1" max="3" step="0.01" value={zoom} onChange={e=>setZoom(Number(e.target.value))} style={{width:'100%',accentColor:GOLD}}/>
      </div>
      <div style={{color:MUTED,fontSize:12,marginTop:6,textAlign:'center'}}>Arraste para reposicionar</div>
      <div style={{display:'flex',gap:12,marginTop:24,width:'100%',maxWidth:260}}>
        <button onClick={onCancel} style={{flex:1,background:'transparent',border:`1px solid ${BDR}`,borderRadius:12,padding:'12px',color:MUTED,fontSize:14,cursor:'pointer',fontFamily:F}}>Cancelar</button>
        <button onClick={confirm} style={{flex:1,background:GOLD,border:'none',borderRadius:12,padding:'12px',color:'#0C0C0A',fontSize:14,fontWeight:700,cursor:'pointer',fontFamily:F}}>Usar foto</button>
      </div>
    </div>
  );
}

    if(!email||email==="—")return;
    try{
      await _sb.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin});
      setSenhaMsg(`Email enviado para ${email}`);
    }catch{setSenhaMsg("Erro ao enviar. Tente novamente.");}
  };
  const handleAvatarChange=e=>{
    const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=ev=>setCropSrc(ev.target.result);
    reader.readAsDataURL(f);
    e.target.value="";
  };
  const handleCropConfirm=blob=>{
    setCroppedBlob(blob);
    setAvatarPreview(URL.createObjectURL(blob));
    setCropSrc(null);
  };
  const saveProfile=async()=>{
    setSaving(true);
    setSaveError("");
    try{
      const tok=(await _sb?.auth?.getSession())?.data?.session?.access_token||"";
      let avatarUrl=profile?.avatar_url||"";
      if(croppedBlob){
        const b64=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(croppedBlob);});
        const respAvatar=await fetch(`${RAILWAY}/api/user/avatar`,{method:"POST",headers:{"Content-Type":"application/json",Authorization:`Bearer ${tok}`},body:JSON.stringify({base64:b64})});
        const d=await respAvatar.json();
        if(!respAvatar.ok)throw new Error(d.error||"Falha ao enviar a foto");
        if(d.url)avatarUrl=d.url;
      }
      const respProfile=await fetch(`${RAILWAY}/api/user/profile`,{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:`Bearer ${tok}`},body:JSON.stringify({name:editName,company_name:editCompany,avatar_url:avatarUrl})});
      const dProfile=await respProfile.json();
      if(!respProfile.ok)throw new Error(dProfile.error||"Falha ao salvar o perfil");
      setAvatarPreview(avatarUrl);
      setEditing(false);
      setCroppedBlob(null);
      onSaved&&onSaved();
    }catch(e){
      console.error("[perfil save]",e);
      setSaveError(e.message||"Erro ao salvar. Tente novamente.");
    }
    setSaving(false);
  };
  const contaItems=[
    {icon:"📧",label:email||"—",onClick:null},
    {icon:"🔒",label:senhaMsg||"Alterar senha",onClick:handleSenha},
    ...(isAdmin?[
      {icon:"⚙",label:"Taxas da plataforma",onClick:()=>onNavigate&&onNavigate("config")},
      {icon:"⎈",label:"Integrações",onClick:()=>onNavigate&&onNavigate("integracoes")},
    ]:[]),
    {icon:"📞",label:"Suporte",onClick:()=>window.open("https://wa.me/5524999828918","_blank")},
  ];
  const initials=(profile?.name||"P")[0].toUpperCase();
  return(
    <>
    {cropSrc&&<CropModal src={cropSrc} onConfirm={handleCropConfirm} onCancel={()=>setCropSrc(null)}/>}
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.65)",backdropFilter:"blur(6px)",WebkitBackdropFilter:"blur(6px)",zIndex:200,display:"flex",alignItems:"flex-end"}}>
      <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:480,margin:"0 auto",background:CARD,borderRadius:"24px 24px 0 0",padding:"12px 24px 40px",maxHeight:"85vh",overflowY:"auto"}}>
        <div style={{width:32,height:4,borderRadius:2,background:"rgba(255,255,255,0.15)",margin:"0 auto 20px"}}/>
        {/* Avatar + nome */}
        <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:20}}>
          <div style={{position:"relative",flexShrink:0}} onClick={()=>editing&&document.getElementById('avatar-file-input').click()}>
            {avatarPreview
              ?<img src={avatarPreview} style={{width:56,height:56,borderRadius:"50%",objectFit:"cover",border:`2px solid ${GOLD}40`}}/>
              :<div style={{width:56,height:56,borderRadius:"50%",background:CARD3,border:`2px solid ${GOLD}30`,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:22,color:TEXT}}>{initials}</div>}
            {editing&&<div style={{position:"absolute",inset:0,borderRadius:"50%",background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:16}}>📷</div>}
          </div>
          <input id="avatar-file-input" type="file" accept="image/*" style={{display:"none"}} onChange={handleAvatarChange}/>
          <div style={{flex:1,minWidth:0}}>
            {editing?(
              <>
                <input value={editName} onChange={e=>setEditName(e.target.value)} placeholder="Seu nome" style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:8,padding:"6px 10px",color:TEXT,fontSize:15,fontWeight:700,outline:"none",marginBottom:6,boxSizing:"border-box"}}/>
                <input value={editCompany} onChange={e=>setEditCompany(e.target.value)} placeholder="Nome da empresa" style={{width:"100%",background:CARD2,border:`1px solid ${BDR}`,borderRadius:8,padding:"6px 10px",color:MUTED,fontSize:12,outline:"none",boxSizing:"border-box"}}/>
              </>
            ):(
              <>
                <div style={{color:TEXT,fontWeight:800,fontSize:17}}>{profile?.name||"Produtor"}</div>
                <div style={{color:MUTED,fontSize:12,marginTop:2}}>{profile?.company_name||"JosephPay"}</div>
              </>
            )}
          </div>
          <button onClick={()=>{if(editing){saveProfile();}else{setSaveError("");setEditName(profile?.name||"");setEditCompany(profile?.company_name||"");setEditing(true);}}} style={{background:editing?GOLD:`${GOLD}18`,border:`1px solid ${GOLD}40`,color:editing?"#000":GOLD,borderRadius:8,padding:"5px 12px",fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0}}>{saving?"…":editing?"Salvar":"Editar"}</button>
        </div>
        {saveError&&<div style={{color:RED,fontSize:12,fontWeight:600,marginBottom:14,marginTop:-8}}>{saveError}</div>}
        {/* Status */}
        <div style={{color:MUTED,fontSize:10,fontWeight:700,letterSpacing:"0.09em",textTransform:"uppercase",marginBottom:10}}>Status</div>
        <div style={{background:CARD2,borderRadius:16,overflow:"hidden",marginBottom:20}}>
          {statusItems.map((s,i,arr)=>(
            <div key={s.label} onClick={s.action||undefined} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 16px",borderBottom:i<arr.length-1?`1px solid ${BDR}`:"none",cursor:s.action?"pointer":"default"}}>
              <div style={{width:7,height:7,borderRadius:"50%",background:s.c,flexShrink:0}}/>
              <span style={{color:MUTED,fontSize:13,flex:1}}>{s.label}</span>
              <span style={{color:s.c,fontWeight:700,fontSize:13}}>{s.val}</span>
              {s.action&&<span style={{color:GOLD,fontSize:15,marginLeft:4,lineHeight:1}}>›</span>}
            </div>
          ))}
        </div>
        {/* Conta */}
        <div style={{color:MUTED,fontSize:10,fontWeight:700,letterSpacing:"0.09em",textTransform:"uppercase",marginBottom:10}}>Conta</div>
        <div style={{background:CARD2,borderRadius:16,overflow:"hidden",marginBottom:24}}>
          {contaItems.map((item,i,arr)=>(
            <div key={i} onClick={item.onClick||undefined} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 16px",borderBottom:i<arr.length-1?`1px solid ${BDR}`:"none",cursor:item.onClick?"pointer":"default"}}>
              <span style={{fontSize:15,flexShrink:0}}>{item.icon}</span>
              <span style={{color:item.onClick?TEXT:MUTED,fontSize:13}}>{item.label}</span>
              {item.onClick&&<span style={{color:MUTED,fontSize:16,marginLeft:"auto"}}>›</span>}
            </div>
          ))}
        </div>
        <button id="btn-logout" onClick={onLogout} style={{width:"100%",background:`${RED}14`,border:`1px solid ${RED}30`,borderRadius:100,padding:14,color:RED,fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:F}}>Sair da conta</button>
      </div>
    </div>
    </>
  );
}

// GOOGLE ADS (Admin) — o admin é o gestor de tráfego dos produtores. Uma aba só
// no rodapé ("Google Ads"); todas as telas abaixo são internas, acessadas pelos
// botões da Visão Geral — não aparecem no rodapé.
// Números de contatos/clientes/faturamento/visitas SEMPRE são reais (vêm do que
// o JosephPay já rastreia). Investimento/campanhas/anúncios/palavras-chave só
// aparecem depois que o Google Ads estiver de fato conectado — até lá, mostramos
// "conexão pendente" em vez de inventar número.

function pctChange(atual,anterior){
  if(!anterior)return atual>0?"+100%":"0%";
  const pct=((atual-anterior)/anterior)*100;
  return `${pct>=0?"+":""}${pct.toFixed(0)}%`;
}

function GAPeriodoChips({presetDias,setPresetDias}){
  const OPCOES=[{d:7,label:"7 dias"},{d:14,label:"14 dias"},{d:30,label:"30 dias"},{d:90,label:"90 dias"}];
  return(
    <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:2}}>
      {OPCOES.map(o=>(
        <button key={o.d} onClick={()=>setPresetDias(o.d)} style={{padding:"5px 12px",borderRadius:20,border:`1px solid ${o.d===presetDias?GOLD+"55":BDR}`,background:o.d===presetDias?`${GOLD}14`:"transparent",color:o.d===presetDias?GOLD:MUTED,fontSize:11,fontWeight:700,cursor:"pointer",flexShrink:0,fontFamily:F,whiteSpace:"nowrap"}}>{o.label}</button>
      ))}
    </div>
  );
}

function GAVisaoGeral({clientes,clienteId,setClienteId,cliente,presetDias,setPresetDias,onNav}){

  },[clienteId,presetDias]);
  const a=overview?.atual;
  const custoContato=(overview?.investimento!=null&&a?.contatos)?fmtBRL(overview.investimento/a.contatos):"—";

  const ACOES=[
    {id:"campanhas",label:"Ver campanhas"},

    {id:"palavras",label:"Ver palavras-chave"},
